<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ✅ CORRIGIDO: Meta tag atualizada -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    
    <title>Visão Geral - Átomo Feito de Estrelas</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        
        header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo-text {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .logo-emoji {
            font-size: 3rem;
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            border-color: #00d4ff;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.1);
        }
        
        .card-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8892b0;
            margin-bottom: 10px;
        }
        
        .card-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00d4ff;
        }
        
        .card-value.green {
            color: #64ffda;
        }
        
        .card-value.red {
            color: #ff6b6b;
        }
        
        .card-value.yellow {
            color: #ffd93d;
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }
        
        .chart-container h2 {
            margin-bottom: 20px;
            color: #00d4ff;
        }
        
        .chart-placeholder {
            height: 300px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 20px 0;
            gap: 15px;
        }
        
        .bar {
            flex: 1;
            background: linear-gradient(180deg, #00d4ff, #0066ff);
            border-radius: 5px 5px 0 0;
            min-height: 20px;
            transition: all 0.5s ease;
            position: relative;
        }
        
        .bar:hover {
            opacity: 0.8;
            transform: scaleY(1.02);
        }
        
        .bar-label {
            text-align: center;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #8892b0;
        }
        
        .bar-value {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: #ffffff;
        }
        
        .table-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            text-align: left;
            padding: 15px 10px;
            color: #00d4ff;
            border-bottom: 2px solid rgba(0, 212, 255, 0.2);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
        
        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .status-badge.active {
            background: rgba(100, 255, 218, 0.2);
            color: #64ffda;
        }
        
        .status-badge.pending {
            background: rgba(255, 217, 61, 0.2);
            color: #ffd93d;
        }
        
        .status-badge.inactive {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }
        
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            
            .logo-text {
                font-size: 1.8rem;
            }
            
            .cards-grid {
                grid-template-columns: 1fr;
            }
            
            .chart-placeholder {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ✅ CORRIGIDO: Logo com fallback -->
        <header>
            <div class="logo-container">
                <span class="logo-emoji">⚛️</span>
                <span class="logo-text">Átomo Feito de Estrelas</span>
            </div>
            <div style="margin-left: auto; font-size: 0.9rem; color: #8892b0;">
                <span id="currentDate"></span>
            </div>
        </header>

        <!-- Cards de Métricas -->
        <div class="cards-grid">
            <div class="card">
                <div class="card-title">Total de Vendas</div>
                <div class="card-value" id="totalSales">R$ 0,00</div>
            </div>
            <div class="card">
                <div class="card-title">Produtos em Estoque</div>
                <div class="card-value green" id="totalProducts">0</div>
            </div>
            <div class="card">
                <div class="card-title">Clientes Ativos</div>
                <div class="card-value yellow" id="activeClients">0</div>
            </div>
            <div class="card">
                <div class="card-title">Vendas Hoje</div>
                <div class="card-value" id="todaySales">R$ 0,00</div>
            </div>
        </div>

        <!-- Gráfico -->
        <div class="chart-container">
            <h2>📊 Vendas por Mês</h2>
            <div class="chart-placeholder" id="chartBars">
                <!-- Os dados serão inseridos via JavaScript -->
            </div>
        </div>

        <!-- Tabela de Últimas Vendas -->
        <div class="table-container">
            <h2 style="margin-bottom: 20px; color: #00d4ff;">📋 Últimas Vendas</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Produto</th>
                        <th>Valor</th>
                        <th>Status</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody id="salesTableBody">
                    <!-- Dados inseridos via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ✅ CORRIGIDO: JavaScript sem redeclaração -->
    <script>
        // ============== CONFIGURAÇÃO ==============
        // Usando window.API para evitar redeclaração
        if (typeof window.API === 'undefined') {
            window.API = {
                baseUrl: 'https://sua-api.com',
                endpoints: {
                    sales: '/api/sales',
                    products: '/api/products',
                    clients: '/api/clients'
                }
            };
        }

        // ============== DADOS MOCK ==============
        // Usando dados de exemplo (substitua pela sua API)
        const mockData = {
            totalSales: 45230.50,
            totalProducts: 156,
            activeClients: 89,
            todaySales: 2375.00,
            monthlySales: [12500, 9800, 14200, 11800, 16300, 14700, 18500, 17200, 19800, 21300, 22800, 24500],
            recentSales: [
                { id: 1001, cliente: 'João Silva', produto: 'Smart TV 55"', valor: 2799.90, status: 'Concluído', data: '2026-09-06' },
                { id: 1002, cliente: 'Maria Santos', produto: 'Notebook Dell', valor: 4599.00, status: 'Pendente', data: '2026-09-06' },
                { id: 1003, cliente: 'Pedro Oliveira', produto: 'Fone Bluetooth', valor: 299.90, status: 'Concluído', data: '2026-09-05' },
                { id: 1004, cliente: 'Ana Costa', produto: 'Smartphone Samsung', valor: 3299.00, status: 'Cancelado', data: '2026-09-05' },
                { id: 1005, cliente: 'Carlos Lima', produto: 'Monitor 24"', valor: 899.90, status: 'Concluído', data: '2026-09-04' }
            ]
        };

        // ============== FUNÇÕES ==============
        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(value);
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('pt-BR');
        }

        function getStatusBadge(status) {
            const classes = {
                'Concluído': 'active',
                'Pendente': 'pending',
                'Cancelado': 'inactive'
            };
            return `<span class="status-badge ${classes[status] || 'pending'}">${status}</span>`;
        }

        // ============== RENDERIZAÇÃO ==============
        function renderDashboard() {
            try {
                // Atualizar cards
                document.getElementById('totalSales').textContent = formatCurrency(mockData.totalSales);
                document.getElementById('totalProducts').textContent = mockData.totalProducts;
                document.getElementById('activeClients').textContent = mockData.activeClients;
                document.getElementById('todaySales').textContent = formatCurrency(mockData.todaySales);

                // Atualizar data
                document.getElementById('currentDate').textContent = new Date().toLocaleDateString('pt-BR', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                // Renderizar gráfico
                renderChart(mockData.monthlySales);

                // Renderizar tabela
                renderTable(mockData.recentSales);
            } catch (error) {
                console.error('Erro ao renderizar dashboard:', error);
            }
        }

        function renderChart(data) {
            const container = document.getElementById('chartBars');
            const maxValue = Math.max(...data);
            
            container.innerHTML = data.map((value, index) => {
                const height = (value / maxValue) * 100;
                const months = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
                return `
                    <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
                        <div style="width:100%; display:flex; flex-direction:column; align-items:center;">
                            <div class="bar" style="height: ${Math.max(height, 10)}px; width:60%;">
                                <div class="bar-value">${formatCurrency(value)}</div>
                            </div>
                            <div class="bar-label">${months[index]}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderTable(data) {
            const tbody = document.getElementById('salesTableBody');
            tbody.innerHTML = data.map(sale => `
                <tr>
                    <td>#${sale.id}</td>
                    <td>${sale.cliente}</td>
                    <td>${sale.produto}</td>
                    <td>${formatCurrency(sale.valor)}</td>
                    <td>${getStatusBadge(sale.status)}</td>
                    <td>${formatDate(sale.data)}</td>
                </tr>
            `).join('');
        }

        // ============== INICIALIZAÇÃO ==============
        document.addEventListener('DOMContentLoaded', function() {
            renderDashboard();
            console.log('✅ Dashboard carregado com sucesso!');
        });
    </script>
</body>
</html>
