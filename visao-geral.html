<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visão Geral - Painel Mágico</title>
    
    <!-- ======================================== -->
    <!-- PARTE 1: OS ESTILOS (as cores bonitas)   -->
    <!-- ======================================== -->
    <style>
        /* Limpa as bordas e deixa tudo bonito */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        
        /* O container principal (como uma caixa grande) */
        .dashboard-container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* ======================================== */
        /* O PAINEL DE CONTROLE (lado esquerdo)     */
        /* ======================================== */
        .control-panel {
            flex: 0 0 280px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        
        .control-panel h3 {
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .control-panel .subtitle {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        /* Cada opção (linha com checkbox) */
        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            margin: 6px 0;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .option-item:hover {
            background: #e9ecef;
        }
        
        .option-item.active {
            border-color: #3498db;
            background: #ebf5fb;
        }
        
        .option-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3498db;
        }
        
        .option-item .label-text {
            font-weight: bold;
            color: #2c3e50;
        }
        
        .option-item .desc-text {
            font-size: 12px;
            color: #6c757d;
        }
        
        /* Botão resetar */
        .btn-reset {
            width: 100%;
            padding: 10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 12px;
        }
        
        .btn-reset:hover {
            background: #c82333;
        }
        
        /* ======================================== */
        /* ÁREA DOS WIDGETS (lado direito)          */
        /* ======================================== */
        .widgets-area {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            align-content: start;
        }
        
        /* Cada bloco (widget) */
        .widget {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e9ecef;
            transition: all 0.3s ease;
            animation: fadeIn 0.3s ease;
        }
        
        .widget.hidden {
            display: none;
        }
        
        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f3f5;
            padding-bottom: 10px;
        }
        
        .widget-header h4 {
            margin: 0;
            color: #2c3e50;
        }
        
        .widget-close {
            background: none;
            border: none;
            color: #adb5bd;
            cursor: pointer;
            font-size: 20px;
            padding: 0 4px;
        }
        
        .widget-close:hover {
            color: #dc3545;
        }
        
        .widget-content {
            color: #495057;
            font-size: 15px;
        }
        
        .widget-content ul {
            padding-left: 20px;
            margin: 8px 0;
        }
        
        .widget-content li {
            margin: 4px 0;
        }
        
        /* Animação de entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Estado vazio (quando não tem nada selecionado) */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .empty-state h3 {
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        /* ======================================== */
        /* PARTE RESPONSIVA (para celular)          */
        /* ======================================== */
        @media (max-width: 768px) {
            .dashboard-container {
                flex-direction: column;
            }
            .control-panel {
                position: static;
                flex: none;
            }
            .widgets-area {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<!-- ======================================== -->
<!-- PARTE 2: O CORPO DA PÁGINA               -->
<!-- ======================================== -->

<div class="dashboard-container">
    
    <!-- ======================================== -->
    <!-- PAINEL DE CONTROLE (lado esquerdo)       -->
    <!-- ======================================== -->
    <aside class="control-panel">
        <h3>📊 Selecione o que ver</h3>
        <p class="subtitle">Clique para adicionar ou remover blocos</p>
        
        <!-- Aqui o JavaScript vai colocar as opções -->
        <div id="optionsList"></div>
        
        <hr style="margin: 16px 0; border-color: #e9ecef;">
        <button class="btn-reset" onclick="resetDashboard()">🔄 Mostrar todos novamente</button>
    </aside>
    
    <!-- ======================================== -->
    <!-- ÁREA DOS BLOCOS (lado direito)           -->
    <!-- ======================================== -->
    <main class="widgets-area" id="widgetsArea">
        <!-- Aqui o JavaScript vai colocar os blocos -->
    </main>
    
</div>

<!-- ======================================== -->
<!-- PARTE 3: O CÓDIGO MÁGICO (JavaScript)    -->
<!-- ======================================== -->
<script>
    // ============================================
    // 3.1 - LISTA DE BLOCOS DISPONÍVEIS
    //      (AQUI VOCÊ PODE ADICIONAR MAIS)
    // ============================================
    
    const WIDGETS_CONFIG = [
        {
            id: 'vendas',
            label: '📈 Vendas do Dia',
            description: 'Total de vendas e metas',
            // Esta função vai buscar os dados da sua API
            render: () => fetch('/api/vendas')
                .then(r => r.json())
                .then(data => {
                    return `<p><strong>R$ ${data.total}</strong> em vendas hoje</p>
                            <p>Meta: ${data.meta}% atingida</p>`;
                })
                .catch(() => `<p style="color:#dc3545;">⚠️ Erro ao carregar</p>`)
        },
        {
            id: 'produtos',
            label: '📦 Produtos em Destaque',
            description: 'Os mais vendidos do mês',
            render: () => fetch('/api/produtos-destaque')
                .then(r => r.json())
                .then(data => {
                    if (data.length === 0) return '<p>Nenhum produto em destaque</p>';
                    return `<ul>${data.map(p => `<li>${p.nome} - ${p.vendas} vendas</li>`).join('')}</ul>`;
                })
                .catch(() => `<p style="color:#dc3545;">⚠️ Erro ao carregar</p>`)
        },
        {
            id: 'carteira',
            label: '💰 Carteira Digital',
            description: 'Seu saldo e movimentações',
            render: () => fetch('/api/carteira')
                .then(r => r.json())
                .then(data => {
                    return `<p><strong>Saldo: R$ ${data.saldo}</strong></p>
                            <p>Última movimentação: ${data.ultima || 'hoje'}</p>`;
                })
                .catch(() => `<p style="color:#dc3545;">⚠️ Erro ao carregar</p>`)
        },
        {
            id: 'risco',
            label: '⚠️ Análise de Risco',
            description: 'Alertas e indicadores',
            render: () => fetch('/api/risco')
                .then(r => r.json())
                .then(data => {
                    const cor = data.cor || '#6c757d';
                    return `<p>Nível: <span style="color:${cor}; font-weight:bold;">${data.nivel}</span></p>
                            <p>${data.alertas || 0} alertas ativos</p>`;
                })
                .catch(() => `<p style="color:#dc3545;">⚠️ Erro ao carregar</p>`)
        },
        {
            id: 'regiao',
            label: '🌎 Vendas por Região',
            description: 'Distribuição geográfica',
            render: () => fetch('/api/vendas-regiao')
                .then(r => r.json())
                .then(data => {
                    const items = Object.entries(data);
                    if (items.length === 0) return '<p>Nenhuma venda por região</p>';
                    return `<ul>${items.map(([regiao, valor]) => 
                        `<li>${regiao}: R$ ${valor}</li>`).join('')}</ul>`;
                })
                .catch(() => `<p style="color:#dc3545;">⚠️ Erro ao carregar</p>`)
        },
        {
            id: 'shelflife',
            label: '📅 Validade (Shelf Life)',
            description: 'Produtos próximos ao vencimento',
            render: () => fetch('/api/shelflife')
                .then(r => r.json())
                .then(data => {
                    if (data.length === 0) return '<p>✅ Nenhum produto perto do vencimento</p>';
                    return `<ul>${data.map(p => `<li>${p.nome} - vence em ${p.dias} dias</li>`).join('')}</ul>`;
                })
                .catch(() => `<p style="color:#dc3545;">⚠️ Erro ao carregar</p>`)
        }
    ];

    // ============================================
    // 3.2 - ONDE GUARDAMOS O QUE ESTÁ SELECIONADO
    // ============================================
    
    let activeWidgets = [];
    
    // Carregar as preferências salvas no computador
    function loadPreferences() {
        const saved = localStorage.getItem('dashboardWidgets');
        if (saved) {
            try {
                activeWidgets = JSON.parse(saved);
                // Garantir que só existem blocos que ainda estão na lista
                activeWidgets = activeWidgets.filter(id => 
                    WIDGETS_CONFIG.some(w => w.id === id)
                );
                return;
            } catch(e) {}
        }
        // Se não tiver nada salvo, mostrar todos os blocos
        activeWidgets = WIDGETS_CONFIG.map(w => w.id);
    }
    
    // Salvar as preferências no computador
    function savePreferences() {
        localStorage.setItem('dashboardWidgets', JSON.stringify(activeWidgets));
    }

    // ============================================
    // 3.3 - DESENHAR A TELA
    // ============================================
    
    // Desenhar a lista de opções (no lado esquerdo)
    function renderOptions() {
        const container = document.getElementById('optionsList');
        container.innerHTML = WIDGETS_CONFIG.map(widget => {
            const isActive = activeWidgets.includes(widget.id);
            return `
                <label class="option-item ${isActive ? 'active' : ''}">
                    <input type="checkbox" 
                           ${isActive ? 'checked' : ''}
                           onchange="toggleWidget('${widget.id}')">
                    <div>
                        <div class="label-text">${widget.label}</div>
                        <div class="desc-text">${widget.description}</div>
                    </div>
                </label>
            `;
        }).join('');
    }
    
    // Desenhar os blocos (no lado direito)
    async function renderWidgets() {
        const area = document.getElementById('widgetsArea');
        
        // Se não tiver nenhum bloco selecionado, mostrar mensagem vazia
        if (activeWidgets.length === 0) {
            area.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📋</div>
                    <h3>Nenhum bloco selecionado</h3>
                    <p>Marque as opções no painel ao lado para começar a ver seus dados.</p>
                </div>
            `;
            return;
        }
        
        // Para cada bloco ativo, buscar os dados e desenhar
        const widgetsHtml = await Promise.all(
            activeWidgets.map(async (widgetId) => {
                const config = WIDGETS_CONFIG.find(w => w.id === widgetId);
                if (!config) return '';
                
                try {
                    const content = await config.render();
                    return `
                        <div class="widget" id="widget-${widgetId}">
                            <div class="widget-header">
                                <h4>${config.label}</h4>
                                <button class="widget-close" onclick="toggleWidget('${widgetId}')" title="Remover">✕</button>
                            </div>
                            <div class="widget-content">
                                ${content}
                            </div>
                        </div>
                    `;
                } catch (error) {
                    return `
                        <div class="widget" id="widget-${widgetId}" style="border-color:#dc3545;">
                            <div class="widget-header">
                                <h4>${config.label}</h4>
                                <button class="widget-close" onclick="toggleWidget('${widgetId}')">✕</button>
                            </div>
                            <div class="widget-content" style="color:#dc3545;">
                                ⚠️ Erro ao carregar os dados
                            </div>
                        </div>
                    `;
                }
            })
        );
        
        area.innerHTML = widgetsHtml.filter(html => html !== '').join('');
    }

    // ============================================
    // 3.4 - O QUE ACONTECE QUANDO O USUÁRIO CLICA
    // ============================================
    
    // Quando o usuário clica em um checkbox
    function toggleWidget(widgetId) {
        const index = activeWidgets.indexOf(widgetId);
        if (index === -1) {
            // Se não estava ativo, adicionar
            activeWidgets.push(widgetId);
        } else {
            // Se estava ativo, remover
            activeWidgets.splice(index, 1);
        }
        savePreferences();      // Salvar no computador
        renderOptions();        // Atualizar a lista de opções
        renderWidgets();        // Atualizar os blocos
    }
    
    // Quando o usuário clica no botão "Mostrar todos novamente"
    function resetDashboard() {
        activeWidgets = WIDGETS_CONFIG.map(w => w.id);
        savePreferences();
        renderOptions();
        renderWidgets();
    }

    // ============================================
    // 3.5 - INICIAR A PÁGINA
    // ============================================
    
    // Carregar as preferências salvas
    loadPreferences();
    // Desenhar a lista de opções
    renderOptions();
    // Desenhar os blocos
    renderWidgets();
    
    // (Opcional) Atualizar os dados a cada 30 segundos
    setInterval(renderWidgets, 30000);
    
    // Mostrar uma mensagem no console (para você saber que funcionou)
    console.log('🎉 Painel mágico carregado com sucesso!');
</script>

</body>
</html>
