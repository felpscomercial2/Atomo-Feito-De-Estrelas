<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Átomo — Análise Região</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Google Fonts - Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   ÁTOMO LIGHT — Tema Refinado com Contraste Aprimorado
   ========================================================= */

:root {
  --bg-body: #F2F4F8;
  --bg-card: #FFFFFF;
  --bg-sidebar: #FFFFFF;
  --text-primary: #0F172A;
  --text-secondary: #1E293B;
  --text-muted: #475569;
  --border-light: #E2E8F0;
  --shadow-card: 0 2px 16px rgba(0, 0, 0, 0.04), 0 1px 4px rgba(0, 0, 0, 0.02);
  --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.07), 0 2px 8px rgba(0, 0, 0, 0.03);
  --shadow-dropdown: 0 16px 48px rgba(0, 0, 0, 0.08);
  --accent-primary: #1D4ED8;
  --accent-primary-hover: #2563EB;
  --accent-secondary: #3B82F6;
  --color-success: #0B7C3C;
  --color-danger: #DC2626;
  --color-warning: #E98E0E;
  --color-roxo: #7C3AED;
  --radius-default: 14px;
  --radius-sm: 10px;
  --radius-lg: 20px;
  --transition-smooth: cubic-bezier(0.34, 1.56, 0.64, 1);
  --transition-ease: cubic-bezier(0.4, 0, 0.2, 1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  background: var(--bg-body) !important;
  color: var(--text-primary) !important;
  font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.6 !important;
  min-height: 100vh;
}

/* =========================================================
   SIDEBAR
   ========================================================= */
.sidebar {
  width: 232px;
  background: var(--bg-card) !important;
  border-right: 1px solid var(--border-light) !important;
  box-shadow: 2px 0 16px rgba(0, 0, 0, 0.02) !important;
  padding: 28px 16px !important;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 100;
  transition: transform 0.4s var(--transition-smooth) !important;
  overflow-y: auto;
}

.sidebar-logo {
  width: 100px;
  margin-bottom: 4px;
  filter: none !important;
  animation: none !important;
  transition: transform 0.3s var(--transition-smooth);
}

.sidebar-logo:hover {
  transform: scale(1.04);
}

.sidebar-title {
  color: var(--text-secondary) !important;
  font-size: 10px !important;
  letter-spacing: 2px !important;
  font-weight: 600 !important;
  text-transform: uppercase !important;
  background: none !important;
  -webkit-text-fill-color: var(--text-secondary) !important;
  margin-bottom: 28px;
}

.nav-section {
  width: 100%;
  font-size: 9px;
  letter-spacing: 1.2px;
  color: var(--text-muted) !important;
  text-transform: uppercase;
  padding: 0 8px;
  margin-bottom: 8px;
}

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px !important;
  border-radius: var(--radius-sm) !important;
  margin-bottom: 2px !important;
  font-weight: 500 !important;
  font-size: 13px !important;
  color: var(--text-secondary) !important;
  text-decoration: none;
  transition: all 0.25s var(--transition-ease) !important;
  border: 1px solid transparent !important;
  position: relative;
}

.nav-item::after {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%) scaleY(0);
  width: 3px;
  height: 60%;
  background: var(--accent-primary);
  border-radius: 0 4px 4px 0;
  transition: transform 0.3s var(--transition-ease);
}

.nav-item:hover::after {
  transform: translateY(-50%) scaleY(1);
}

.nav-item:hover {
  background: #F1F4F9 !important;
  color: var(--text-primary) !important;
  border-color: transparent !important;
  transform: translateX(4px);
}

.nav-item.active {
  background: #EEF2FF !important;
  color: var(--accent-primary) !important;
  border-color: transparent !important;
  font-weight: 600 !important;
}

.nav-item.active::after {
  transform: translateY(-50%) scaleY(1);
}

.nav-item .icon {
  font-size: 16px;
  width: 20px;
  text-align: center;
  transition: transform 0.25s var(--transition-smooth);
}

.nav-item:hover .icon {
  transform: scale(1.12);
}

.sidebar-divider {
  width: 100%;
  height: 1px;
  background: var(--border-light) !important;
  margin: 14px 0;
}

.btn-logout {
  margin-top: auto;
  width: 100%;
  padding: 10px;
  border-radius: var(--radius-sm);
  background: #FEF2F2 !important;
  color: var(--color-danger) !important;
  border: 1px solid #FECACA !important;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.25s var(--transition-ease);
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-logout:hover {
  background: #FEE2E2 !important;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(220, 38, 38, 0.12);
}

/* =========================================================
   ÁREA PRINCIPAL
   ========================================================= */
.main {
  margin-left: 232px;
  flex: 1;
  padding: 32px 40px !important;
  background: var(--bg-body) !important;
  color: var(--text-primary) !important;
  min-height: 100vh;
  transition: margin-left 0.4s var(--transition-smooth);
}

/* =========================================================
   BREADCRUMB
   ========================================================= */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-muted) !important;
  margin-bottom: 16px;
  animation: fadeSlideDown 0.5s var(--transition-ease);
}

.breadcrumb a {
  color: var(--text-muted) !important;
  text-decoration: none;
  transition: all 0.2s ease;
}

.breadcrumb a:hover {
  color: var(--accent-primary) !important;
}

.breadcrumb .breadcrumb-sep {
  opacity: 0.4;
}

.breadcrumb .breadcrumb-current {
  color: var(--text-primary) !important;
  font-weight: 600;
}

/* =========================================================
   HEADER
   ========================================================= */
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 28px;
  animation: fadeSlideDown 0.6s var(--transition-ease);
}

.header-left h1 {
  font-size: 26px;
  font-weight: 700 !important;
  color: var(--text-primary) !important;
  letter-spacing: -0.03em !important;
}

.header-left p {
  font-size: 14px;
  color: var(--text-secondary) !important;
  margin-top: 4px;
  font-weight: 500;
}

/* =========================================================
   NOTA
   ========================================================= */
.nota {
  font-size: 13px;
  color: var(--text-secondary) !important;
  padding: 12px 18px;
  background: #FFFBEB !important;
  border: 1px solid #FDE68A !important;
  border-radius: var(--radius-sm);
  margin-bottom: 20px;
  animation: fadeSlideDown 0.5s var(--transition-ease);
  font-weight: 450;
}

.nota strong {
  color: var(--text-primary);
  font-weight: 600;
}

/* =========================================================
   FILTROS BAR
   ========================================================= */
.filtros-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 20px;
  padding: 12px 18px;
  background: var(--bg-card) !important;
  border: 1px solid var(--border-light) !important;
  border-radius: var(--radius-sm) !important;
  box-shadow: var(--shadow-card) !important;
  animation: fadeSlideDown 0.5s var(--transition-ease);
}

.filtros-bar-label {
  font-size: 11px;
  color: var(--text-muted) !important;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 600;
  margin-right: 4px;
}

.filtro-tag {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #EEF2FF !important;
  border: 1px solid #C7D2FE !important;
  border-radius: 24px;
  padding: 4px 12px 4px 16px;
  font-size: 12px;
  color: var(--accent-primary) !important;
  font-weight: 500;
  transition: all 0.25s var(--transition-ease);
}

.filtro-tag:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(29, 78, 216, 0.08);
}

.btn-alt-filtros {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-secondary) !important;
  text-decoration: none;
  background: var(--bg-body) !important;
  border: 1px solid var(--border-light) !important;
  border-radius: var(--radius-sm);
  padding: 5px 14px;
  transition: all 0.25s var(--transition-ease);
  font-weight: 500;
  white-space: nowrap;
}

.btn-alt-filtros:hover {
  background: #F1F4F9 !important;
  color: var(--text-primary) !important;
  transform: translateY(-2px);
}

/* =========================================================
   DRILL BAR
   ========================================================= */
.drill-bar {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: #EEF2FF !important;
  border: 1px solid #C7D2FE !important;
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
  font-size: 13px;
  flex-wrap: wrap;
  animation: fadeSlideDown 0.4s var(--transition-ease);
}

.drill-bar.show {
  display: flex;
}

.drill-tag {
  background: var(--bg-card) !important;
  border: 1px solid var(--border-light) !important;
  border-radius: 20px;
  padding: 4px 12px;
  color: var(--accent-primary) !important;
  font-weight: 500;
  font-size: 12px;
}

.drill-clear {
  margin-left: auto;
  background: #FEF2F2 !important;
  color: var(--color-danger) !important;
  border: 1px solid #FECACA !important;
  border-radius: var(--radius-sm);
  padding: 5px 14px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  transition: all 0.25s var(--transition-ease);
  font-family: 'Inter', sans-serif;
}

.drill-clear:hover {
  background: #FEE2E2 !important;
  transform: translateY(-2px);
}

/* =========================================================
   COMPARADOR
   ========================================================= */
.comp-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  padding: 14px 20px;
  background: var(--bg-card) !important;
  border: 1px solid var(--border-light) !important;
  border-radius: var(--radius-default) !important;
  box-shadow: var(--shadow-card) !important;
  margin-bottom: 20px;
  animation: fadeSlideDown 0.5s var(--transition-ease);
}

.comp-wrap label {
  font-size: 12px;
  color: var(--text-secondary) !important;
  font-weight: 600;
}

.comp-wrap select {
  background: var(--bg-body) !important;
  border: 1px solid var(--border-light) !important;
  border-radius: var(--radius-sm) !important;
  color: var(--text-primary) !important;
  padding: 8px 12px;
  font-size: 12px;
  outline: none;
  cursor: pointer;
  transition: all 0.25s var(--transition-ease);
  font-family: 'Inter', sans-serif;
}

.comp-wrap select:focus {
  border-color: var(--accent-primary) !important;
  box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.08) !important;
}

.comp-wrap .vs-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary) !important;
  padding: 4px 12px;
  border-radius: 20px;
  background: var(--bg-body) !important;
  border: 1px solid var(--border-light) !important;
}

.btn-comp {
  padding: 8px 20px;
  background: #FFFBEB !important;
  color: var(--color-warning) !important;
  border: 1px solid #FDE68A !important;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.3s var(--transition-smooth);
  font-family: 'Inter', sans-serif;
}

.btn-comp:hover {
  background: #FEF3C7 !important;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(233, 142, 14, 0.15);
}

/* =========================================================
   COMP GRID
   ========================================================= */
.comp-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
  animation: fadeSlideUp 0.5s var(--transition-ease);
}

.comp-card {
  background: var(--bg-card) !important;
  border: 1px solid var(--border-light) !important;
  border-radius: var(--radius-default) !important;
  box-shadow: var(--shadow-card) !important;
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s var(--transition-ease);
}

.comp-card:hover {
  box-shadow: var(--shadow-hover) !important;
  transform: translateY(-2px);
}

.comp-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
}

.comp-lbl {
  font-size: 10px;
  color: var(--text-muted) !important;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}

.comp-periodos {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
}

.comp-periodo-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.comp-vA-label, .comp-vB-label {
  font-size: 10px;
  color: var(--text-muted) !important;
  white-space: nowrap;
  flex-shrink: 0;
  font-weight: 500;
}

.comp-vA {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary) !important;
  white-space: nowrap;
}

.comp-vB {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary) !important;
  white-space: nowrap;
}

.comp-sep {
  width: 100%;
  height: 1px;
  background: var(--border-light) !important;
}

.comp-pct {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 700;
  padding: 3px 12px;
  border-radius: 20px;
  margin-top: 4px;
}

.c-up {
  color: var(--color-success);
  background: #F0FDF4 !important;
  border: 1px solid #86EFAC !important;
}

.c-dn {
  color: var(--color-danger);
  background: #FEF2F2 !important;
  border: 1px solid #FECACA !important;
}

.c-ne {
  color: var(--text-secondary) !important;
  background: var(--bg-body) !important;
  border: 1px solid var(--border-light) !important;
}

/* =========================================================
   KPI GRID
   ========================================================= */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
  animation: fadeSlideUp 0.7s var(--transition-ease);
}

.kpi-card {
  background: var(--bg-card) !important;
  border: 1px solid var(--border-light) !important;
  border-radius: var(--radius-default) !important;
  box-shadow: var(--shadow-card) !important;
  padding: 18px 20px;
  transition: all 0.4s var(--transition-smooth) !important;
  position: relative;
  overflow: hidden;
  cursor: default;
}

.kpi-card:hover {
  transform: translateY(-4px) !important;
  box-shadow: var(--shadow-hover) !important;
}

.kpi-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--accent-secondary);
  border-radius: var(--radius-default) 0 0 var(--radius-default);
  transition: width 0.3s var(--transition-ease);
}

.kpi-card:hover::before {
  width: 6px;
}

.kpi-card.verde::before   { background: var(--color-success); }
.kpi-card.vermelho::before { background: var(--color-danger); }
.kpi-card.amarelo::before  { background: var(--color-warning); }
.kpi-card.ciano::before    { background: var(--accent-secondary); }
.kpi-card.roxo::before     { background: var(--color-roxo); }

.kpi-label {
  font-size: 10px;
  color: var(--text-secondary) !important;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 600;
  margin-bottom: 6px;
  padding-right: 24px;
}

.kpi-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary) !important;
  line-height: 1.2;
  letter-spacing: -0.02em;
}

.kpi-sub {
  font-size: 11px;
  color: var(--text-secondary) !important;
  margin-top: 4px;
  font-weight: 500;
}

.kpi-icon {
  position: absolute;
  top: 14px;
  right: 14px;
  font-size: 18px;
  opacity: 0.12;
  transition: all 0.4s var(--transition-smooth);
}

.kpi-card:hover .kpi-icon {
  opacity: 0.2;
  transform: scale(1.1) rotate(-8deg);
}

/* =========================================================
   CHARTS ROW
   ========================================================= */
.charts-row {
  display: grid;
  gap: 18px;
  margin-bottom: 18px;
  animation: fadeSlideUp 0.8s var(--transition-ease);
}

.charts-row.col-2-1 {
  grid-template-columns: 2fr 1fr;
}

.charts-row.col-1-1 {
  grid-template-columns: 1fr 1fr;
}

.chart-card {
  background: var(--bg-card) !important;
  border: 1px solid var(--border-light) !important;
  border-radius: var(--radius-default) !important;
  box-shadow: var(--shadow-card) !important;
  padding: 22px 24px;
  transition: all 0.4s var(--transition-smooth);
}

.chart-card:hover {
  box-shadow: var(--shadow-hover) !important;
}

.chart-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary) !important;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: space-between;
}

.chart-subtitle {
  font-size: 12px;
  color: var(--text-secondary) !important;
  margin-bottom: 16px;
  font-weight: 450;
}

canvas {
  max-height: 240px;
  cursor: pointer;
  transition: opacity 0.5s ease;
}

/* =========================================================
   TABLE WRAP
   ========================================================= */
.table-wrap {
  overflow-x: auto;
  max-height: 320px;
  overflow-y: auto;
  border-radius: var(--radius-sm);
}

.table-wrap::-webkit-scrollbar {
  width: 4px;
  height: 4px;
}
.table-wrap::-webkit-scrollbar-track {
  background: var(--bg-body);
  border-radius: 4px;
}
.table-wrap::-webkit-scrollbar-thumb {
  background: var(--border-light);
  border-radius: 4px;
}
.table-wrap::-webkit-scrollbar-thumb:hover {
  background: var(--text-muted);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  color: var(--text-secondary) !important;
  font-weight: 600;
  text-align: left;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-light) !important;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  position: sticky;
  top: 0;
  background: var(--bg-card) !important;
}

td {
  padding: 10px 14px;
  border-bottom: 1px solid rgba(0, 0, 0, 0.04);
  color: var(--text-primary) !important;
  font-weight: 450;
}

tr:hover td {
  background: #F8FAFC !important;
}

.rank {
  color: var(--accent-secondary) !important;
  font-weight: 700;
  width: 30px;
}

.progress-bar {
  background: var(--bg-body) !important;
  border-radius: 4px;
  height: 4px;
  margin-top: 5px;
  overflow: hidden;
}

.progress-fill {
  background: var(--accent-secondary);
  border-radius: 4px;
  height: 4px;
  transition: width 0.8s var(--transition-ease);
}

/* =========================================================
   LOADING
   ========================================================= */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 80px;
  color: var(--text-secondary) !important;
  font-size: 13px;
  gap: 10px;
}

.loading-spinner {
  width: 18px;
  height: 18px;
  border: 2px solid var(--border-light);
  border-top-color: var(--accent-primary);
  border-radius: 50%;
  animation: spin 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
}

.loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(242, 244, 248, 0.92) !important;
  z-index: 9999;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  backdrop-filter: blur(8px);
  transition: opacity 0.5s ease;
}

.loading-overlay.show {
  display: flex;
  animation: fadeIn 0.4s ease;
}

.lo
