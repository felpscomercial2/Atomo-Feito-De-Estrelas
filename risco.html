<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Átomo — Clientes em Risco</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0A1628;--card:#0E2048;--sidebar:#0D2558;--accent:#1976D2;
  --accent2:#64B5F6;--text:#F5F5F5;--muted:#a0aec0;
  --border:rgba(255,255,255,0.07);--success:#00ff88;--danger:#ff4d4d;--warning:#ffaa00;
}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--sidebar);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px;border-right:1px solid var(--border);z-index:100;}
.sidebar-logo{width:100px;margin-bottom:4px;filter:drop-shadow(0 2px 8px rgba(25,118,210,0.4));}
.sidebar-title{font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:28px;}
.nav-section{width:100%;font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;padding:0 8px;margin-bottom:6px;}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);transition:all 0.2s;border:1px solid transparent;text-decoration:none;margin-bottom:2px;}
.nav-item:hover{background:rgba(25,118,210,0.1);color:var(--text);border-color:rgba(25,118,210,0.2);}
.nav-item.active{background:rgba(25,118,210,0.2);color:#fff;border-color:var(--accent);}
.nav-item .icon{font-size:16px;width:20px;text-align:center;}
.sidebar-divider{width:100%;height:1px;background:var(--border);margin:16px 0;}
.btn-logout{margin-top:auto;width:100%;padding:10px;border-radius:8px;background:rgba(255,77,77,0.1);color:var(--danger);border:1px solid rgba(255,77,77,0.2);cursor:pointer;font-size:13px;}
.main{margin-left:220px;flex:1;padding:28px;}

/* SELETOR */
.selector-bar{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.selector-bar label{font-size:13px;color:var(--muted);white-space:nowrap;}
.sel-vendedor{flex:1;min-width:200px;padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;cursor:pointer;}
.sel-vendedor:focus{border-color:var(--accent);}
.sel-vendedor option{background:#0A1628;}
.btn-ver{padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s;white-space:nowrap;}
.btn-ver:hover{background:#1565C0;transform:translateY(-1px);}

/* VENDEDOR HEADER */
.v-header{background:linear-gradient(135deg,rgba(25,118,210,0.2),rgba(0,195,255,0.05));border:1px solid rgba(25,118,210,0.3);border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.v-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#1565C0,#00c3ff);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0;}
.v-nome{font-size:18px;font-weight:700;}
.v-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.v-badges{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
.badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-unidades{background:rgba(25,118,210,0.15);color:var(--accent2);border:1px solid rgba(25,118,210,0.3);}

/* DRILL BAR */
.drill-bar{display:none;align-items:center;gap:10px;padding:10px 16px;background:rgba(0,195,255,0.08);border:1px solid rgba(0,195,255,0.25);border-radius:10px;margin-bottom:16px;font-size:13px;flex-wrap:wrap;}
.drill-bar.show{display:flex;}
.drill-tag{background:rgba(0,195,255,0.15);border:1px solid rgba(0,195,255,0.3);border-radius:20px;padding:4px 12px;color:var(--accent2);font-weight:600;font-size:12px;}
.drill-clear{margin-left:auto;background:rgba(255,77,77,0.1);color:var(--danger);border:1px solid rgba(255,77,77,0.2);border-radius:6px;padding:5px 14px;cursor:pointer;font-size:12px;}

/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:all 0.2s;position:relative;overflow:hidden;}
.kpi-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.kpi-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--accent);border-radius:12px 0 0 12px;}
.kpi-card.verde::before{background:var(--success);}
.kpi-card.vermelho::before{background:var(--danger);}
.kpi-card.amarelo::before{background:var(--warning);}
.kpi-card.ciano::before{background:var(--accent2);}
.kpi-card.roxo::before{background:#a78bfa;}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.kpi-value{font-size:16px;font-weight:700;line-height:1.3;}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:4px;}
.kpi-icon{position:absolute;top:12px;right:10px;font-size:16px;opacity:0.15;}

/* POSITIVAÇÃO ESPECIAL */
.positiv-ring{width:80px;height:80px;position:relative;margin:0 auto 8px;}
.positiv-ring svg{transform:rotate(-90deg);}
.positiv-pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:800;color:var(--success);}

/* COMPARATIVO */
.comp-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.comp-row:last-child{border-bottom:none;}
.comp-label{flex:1;color:var(--muted);}
.comp-vendedor{font-weight:700;min-width:100px;text-align:right;}
.comp-media{color:var(--muted);min-width:100px;text-align:right;font-size:12px;}
.comp-diff{min-width:60px;text-align:right;font-size:12px;font-weight:600;}
.comp-up{color:var(--success);}
.comp-down{color:var(--danger);}

/* CHARTS */
.charts-row{display:grid;gap:16px;margin-bottom:16px;}
.charts-row.col-2{grid-template-columns:1fr 1fr;}
.charts-row.col-3{grid-template-columns:2fr 1fr;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;}
.chart-title{font-size:13px;font-weight:600;margin-bottom:4px;}
</style>
<style>
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.kpi-value{font-size:24px;font-weight:700;margin:6px 0 4px;}
.kpi-label{font-size:12px;color:var(--muted);}
.kpi-card.vermelho .kpi-value{color:var(--danger);}
.kpi-card.amarelo .kpi-value{color:#F5A800;}
.kpi-card.verde .kpi-value{color:#22C55E;}
.filtros-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;}
.filtros-bar label{font-size:12px;color:var(--muted);}
.filtros-bar select{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;font-size:12px;}
.btn-aplicar{padding:8px 18px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
.btn-exportar{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:rgba(34,197,94,0.12);color:#4ADE80;border:1px solid rgba(34,197,94,0.25);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;}
.card-tabela{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.card-tabela-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
.card-tabela-title{font-size:14px;font-weight:600;}
table{width:100%;border-collapse:collapse;}
thead th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.2);}
tbody td{padding:11px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.03);}
tbody tr:hover td{background:rgba(25,118,210,0.05);}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-critico{background:rgba(255,77,77,0.15);color:#FF6B6B;}
.badge-atencao{background:rgba(245,168,0,0.15);color:#F5A800;}
.badge-ok{background:rgba(0,200,255,0.12);color:#00C8FF;}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:14px;}
</style>
</head>
<body>

<div class="sidebar">
  
  <div class="sidebar-title">ÁTOMO</div>

<div class="main">
  <div class="header">
    <div class="header-left">
      <h1>⚠️ Clientes em Risco</h1>
      <p id="subtitulo">Clientes sem compra há um período — oportunidades de reativação</p>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card vermelho"><div class="kpi-icon">⚠️</div><div class="kpi-label">Total em Risco</div><div class="kpi-value" id="kpiTotal">—</div></div>
    <div class="kpi-card amarelo"><div class="kpi-icon">📅</div><div class="kpi-label">Dias Médios Sem Compra</div><div class="kpi-value" id="kpiMedia">—</div></div>
    <div class="kpi-card"><div class="kpi-icon">💰</div><div class="kpi-label">Faturamento Histórico</div><div class="kpi-value" id="kpiFat">—</div></div>
    <div class="kpi-card vermelho"><div class="kpi-icon">🔴</div><div class="kpi-label">Críticos (+120 dias)</div><div class="kpi-value" id="kpiCrit">—</div></div>
    <div class="kpi-card amarelo"><div class="kpi-icon">🟡</div><div class="kpi-label">Atenção (60–120 dias)</div><div class="kpi-value" id="kpiAtenc">—</div></div>
  </div>

  <div class="filtros-bar">
    <label>Sem comprar há mais de:</label>
    <select id="selDias">
      <option value="30">30 dias</option>
      <option value="60" selected>60 dias</option>
      <option value="90">90 dias</option>
      <option value="120">120 dias</option>
      <option value="180">180 dias</option>
    </select>
    <label>Vendedor:</label>
    <select id="selVend"><option value="">Todos</option></select>
    <label>Mostrar:</label>
    <select id="selLimite">
      <option value="100" selected>100</option>
      <option value="200">200</option>
      <option value="500">500</option>
    </select>
    <button class="btn-aplicar" onclick="carregar()">Aplicar</button>
    <button class="btn-exportar" onclick="exportar()">⬇ Exportar Excel</button>
  </div>

  <div class="card-tabela">
    <div class="card-tabela-header">
      <span class="card-tabela-title">Lista de Clientes em Risco</span>
      <span id="countLabel" style="font-size:12px;color:var(--muted)"></span>
    </div>
    <div id="corpo"><div class="loading">Carregando...</div></div>
  </div>
</div>

<script>
var API = 'https://horus-production.up.railway.app';
var dadosRisco = [];

function brl(v) { return (parseFloat(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

function badge(d) {
  if (d >= 120) return '<span class="badge badge-critico">'+d+'d</span>';
  if (d >= 60)  return '<span class="badge badge-atencao">'+d+'d</span>';
  return '<span class="badge badge-ok">'+d+'d</span>';
}

async function carregarVendedores() {
  try {
    var r = await fetch(API+'/api/filtros');
    var d = await r.json();
    var sel = document.getElementById('selVend');
    (d.vendedores||[]).forEach(function(v) {
      var o = document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o);
    });
  } catch(e) {}
}

async function carregar() {
  document.getElementById('corpo').innerHTML = '<div class="loading">Carregando...</div>';
  var dias   = document.getElementById('selDias').value;
  var limite = document.getElementById('selLimite').value;
  var vend   = document.getElementById('selVend').value;
  try {
    var r = await fetch(API+'/api/clientes-em-risco?dias='+dias+'&limite='+limite);
    var d = await r.json();
    dadosRisco = d.clientes || [];
    if (vend) dadosRisco = dadosRisco.filter(function(c){ return c.vendedor===vend; });

    var total  = dadosRisco.length;
    var media  = total ? Math.round(dadosRisco.reduce(function(s,c){return s+c.dias_sem_compra;},0)/total) : 0;
    var fat    = dadosRisco.reduce(function(s,c){return s+c.fat_total;},0);
    var crit   = dadosRisco.filter(function(c){return c.dias_sem_compra>=120;}).length;
    var atenc  = dadosRisco.filter(function(c){return c.dias_sem_compra>=60&&c.dias_sem_compra<120;}).length;

    document.getElementById('kpiTotal').textContent = total.toLocaleString('pt-BR');
    document.getElementById('kpiMedia').textContent = media+'d';
    document.getElementById('kpiFat').textContent   = brl(fat);
    document.getElementById('kpiCrit').textContent  = crit.toLocaleString('pt-BR');
    document.getElementById('kpiAtenc').textContent = atenc.toLocaleString('pt-BR');
    document.getElementById('countLabel').textContent = total+' clientes';
    document.getElementById('subtitulo').textContent = 'Clientes sem compra há mais de '+dias+' dias';

    if (!dadosRisco.length) {
      document.getElementById('corpo').innerHTML = '<div class="loading">Nenhum cliente encontrado para os filtros selecionados.</div>';
      return;
    }

    var html = '<table><thead><tr><th>Código</th><th>Cliente</th><th>Vendedor</th><th>Última Compra</th><th>Dias Sem Compra</th><th>Fat. Total</th><th>Pedidos</th></tr></thead><tbody>';
    dadosRisco.forEach(function(c) {
      html += '<tr>'+
        '<td style="color:var(--muted);font-size:12px">'+(c.cod_cliente||'—')+'</td>'+
        '<td><strong>'+(c.cliente||'—')+'</strong></td>'+
        '<td style="font-size:12px;color:var(--muted)">'+(c.vendedor||'—')+'</td>'+
        '<td style="font-size:12px">'+(c.ultima_compra||'—')+'</td>'+
        '<td>'+badge(c.dias_sem_compra)+'</td>'+
        '<td>'+brl(c.fat_total)+'</td>'+
        '<td style="text-align:center">'+c.num_pedidos+'</td>'+
        '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById('corpo').innerHTML = html;
  } catch(e) {
    document.getElementById('corpo').innerHTML = '<div class="loading" style="color:var(--danger)">Erro: '+e.message+'</div>';
  }
}

function exportar() {
  if (!dadosRisco.length) return;
  var rows = [['Código','Cliente','Vendedor','Última Compra','Dias Sem Compra','Fat. Total','Pedidos']];
  dadosRisco.forEach(function(c) {
    rows.push([c.cod_cliente,c.cliente,c.vendedor,c.ultima_compra,c.dias_sem_compra,c.fat_total,c.num_pedidos]);
  });
  var wb = XLSX.utils.book_new();
  var ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:12},{wch:35},{wch:25},{wch:15},{wch:18},{wch:18},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws, 'Clientes em Risco');
  XLSX.writeFile(wb, 'Atomo-ClientesRisco-'+new Date().toISOString().slice(0,10)+'.xlsx');
}

window.onload = async function() {
  await carregarVendedores();
  carregar();
};
</script>
</body>
</html>
