services:
  - type: web
    name: horus
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 300 --workers 2 --preload
    plan: free
    
    # Configurações de ambiente
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: DB_POOL_MAX
        value: 10
      - key: PYTHONPATH
        value: /opt/render/project/src
    
    # Health check para manter o serviço ativo
    healthCheckPath: /ping
    healthCheckTimeout: 100
    
    # Configurações de rede
    ports:
      - port: 5000
        protocol: http
    
    # Domínios customizados (opcional)
    # domains:
    #   - horus.seudominio.com.br
    
    # Escala automática (apenas para planos pagos)
    # scaling:
    #   minInstances: 1
    #   maxInstances: 2
    #   targetMemoryPercent: 80
    #   targetCPUPercent: 60

