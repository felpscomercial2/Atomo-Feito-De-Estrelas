<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Átomo — Login</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<!-- Google Fonts - Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   ÁTOMO LIGHT — Tema Refinado para Login
   ========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: #F4F6FA;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

/* =========================================================
   LOGIN CARD
   ========================================================= */
.login {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 24px;
}

.login-card {
  background: #FFFFFF;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
  border: 1px solid #E9EDF2;
  padding: 40px 36px;
  width: 100%;
  max-width: 380px;
  text-align: center;
}

/* Logo */
.logo-icon {
  margin-bottom: 8px;
}

.logo-icon svg {
  width: 80px;
  height: 80px;
}

.login-title {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #1E293B;
  margin-bottom: 2px;
}

.login-subtitle {
  font-size: 13px;
  color: #94A3B8;
  font-weight: 500;
  letter-spacing: 1px;
  margin-bottom: 28px;
}

/* Inputs */
.input-group {
  margin-bottom: 14px;
  text-align: left;
}

.input-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #475569;
  margin-bottom: 5px;
  letter-spacing: 0.3px;
}

.input-group input {
  width: 100%;
  padding: 10px 14px;
  background: #FFFFFF;
  border: 1px solid #D1D5DB;
  border-radius: 8px;
  color: #1E293B;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border 0.15s ease, box-shadow 0.15s ease;
}

.input-group input:focus {
  border-color: #1D4ED8;
  box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
  outline: none;
}

.input-group input::placeholder {
  color: #94A3B8;
}

/* Botões */
.btn {
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  transition: all 0.15s ease;
  letter-spacing: 0.3px;
}

.btn-primary {
  background: #1D4ED8;
  color: #FFFFFF;
  margin-top: 4px;
}

.btn-primary:hover {
  background: #2563EB;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
}

.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.btn-secondary {
  background: #FFFFFF;
  color: #475569;
  border: 1px solid #E9EDF2;
  margin-top: 8px;
}

.btn-secondary:hover {
  background: #F8FAFC;
  border-color: #CBD5E1;
}

.btn-admin {
  background: #F1F5F9;
  color: #64748B;
  border: 1px solid #E9EDF2;
  margin-top: 6px;
  font-size: 12px;
  font-weight: 500;
}

.btn-admin:hover {
  background: #E9EDF2;
  color: #1E293B;
}

/* Spinner dentro do botão */
.btn-spinner {
  display: none;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-right: 8px;
}

.btn-primary.loading .btn-spinner {
  display: inline-block;
}

.btn-primary.loading .btn-text {
  display: inline;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Footer */
.login-footer {
  margin-top: 20px;
  font-size: 11px;
  color: #94A3B8;
  letter-spacing: 0.5px;
}

.login-footer span {
  color: #1D4ED8;
  font-weight: 600;
}

/* Toast */
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(50px);
  padding: 12px 24px;
  background: #1E293B;
  color: #FFFFFF;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: all 0.4s ease;
  z-index: 9999;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
  max-width: 90%;
  text-align: center;
}

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* =========================================================
   PAINEL ADMIN (quando logado como admin)
   ========================================================= */
.sidebar {

  font-size: 13px;

  text-align: left;

.btn-sidebar:hover {

}

.btn-inicio {
  background: #EEF2FF !important;
  color: #1D4ED8 !important;

}

.btn-inicio:hover {
  background: #E0E7FF !important;
}

.btn-logout-admin {

}

.btn-logout-admin:hover {

.main {
  margin-left: 220px;

  background: #F4F6FA;

}

.main h2 {
  font-size: 20px;
  font-weight: 600;
  color: #1E293B;
  margin-bottom: 20px;
}

.counters {
  display: grid;
  grid-template-columns: repeat(3, 1fr);

}

.counter {
  background: #FFFFFF;
  border: 1px solid #E9EDF2;
  border-radius: 12px;
  padding: 18px 20px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
}

.counter h3 {
  font-size: 28px;
  font-weight: 700;
  color: #1D4ED8;
}

.counter p {
  font-size: 12px;
  color: #94A3B8;
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}

.user-card {
  background: #FFFFFF;
  border: 1px solid #E9EDF2;
  border-radius: 10px;
  padding: 14px 18px;
  margin: 6px 0;

  justify-content: space-between;
  align-items: center;
  transition: all 0.15s ease;
}

.user-card:hover {
  border-color: #CBD5E1;
}

.user-card p {
  margin: 0;
  font-size: 13px;
  color: #1E293B;
}

.user-card .email {
  font-weight: 600;
}

.status-aprovado {
  color: #0B7C3C !important;
  font-weight: 600;
}
.status-pendente {
  color: #E98E0E !important;
  font-weight: 600;
}

.btn-approve {
  background: #F0FDF4 !important;
  color: #0B7C3C !important;
  border: 1px solid #86EFAC !important;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  transition: all 0.15s ease;
}

.btn-approve:hover {
  background: #DCFCE7 !important;
}

.btn-delete {
  background: #FEF2F2 !important;
  color: #DC2626 !important;
  border: 1px solid #FECACA !important;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  transition: all 0.15s ease;

.btn-delete:hover {

}

/* Scrollbar admin */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {

::-webkit-scrollbar-thumb {

/* Responsivo */
@media (max-width: 600px) {

</style>

<script>
// ============================================================
// FIREBASE CONFIG
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDs1wyLdmz4_2DSt8FXSw-apIeEi0kwzZ4",
  authDomain: "horus-bf93b.firebaseapp.com",
  projectId: "horus-bf93b",
  storageBucket: "horus-bf93b.firebasestorage.app",
  messagingSenderId: "587109575045",
  appId: "1:587109575045:web:0fc32f109aa24399e07cec"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

const LOGO_B64 = "data:image/png;base64,";

// ============================================================
// TOAST
// ============================================================
function showToast(msg, isError) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.className = 'show';
  if (isError) {
    toast.style.background = '#991B1B';
  } else {
    toast.style.background = '#1E293B';
  }
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => { toast.className = ''; }, 3500);
}

// ============================================================
// LOGIN NORMAL
// ============================================================
document.getElementById('loginBtn').onclick = function() {
  const btn = document.getElementById('loginBtn');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    showToast('❌ Preencha e-mail e senha.', true);
    return;
  }

  btn.classList.add('loading');
  btn.disabled = true;

  auth.signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
      localStorage.setItem('horus_user_email', userCredential.user.email);
      window.location.href = 'home.html';
    })
    .catch(err => {
      btn.classList.remove('loading');
      btn.disabled = false;
      let msg = err.message;
      if (err.code === 'auth/user-not-found') msg = 'Usuário não encontrado.';
      if (err.code === 'auth/wrong-password') msg = 'Senha incorreta.';
      if (err.code === 'auth/invalid-email') msg = 'E-mail inválido.';
      showToast('❌ ' + msg, true);
    });
};

// ============================================================
// CRIAR CONTA
// ============================================================
document.getElementById('registerBtn').onclick = function() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    showToast('❌ Preencha e-mail e senha.', true);
    return;
  }

  db.collection("pedidos").add({
    email: email,
    password: password,
    status: "pendente",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  })
  .then(() => {
    showToast('✅ Pedido enviado! Aguarde aprovação do administrador.');
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
  })
  .catch(err => {
    showToast('❌ Erro ao enviar pedido: ' + err.message, true);
  });
};

// ============================================================
// LOGIN ADMIN
// ============================================================
document.getElementById('adminBtn').onclick = function() {
  document.getElementById('loginScreen').innerHTML = `
    <div class="login-card">
      <div class="logo-icon">

            </radialGradient>
            <filter id="logof2">
              <feGaussianBlur stdDeviation="1.5" result="b"/>

          <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#1D4ED8" stroke-width="1.5" opacity="0.6" transform="rotate(120,40,40)"/>
          <circle cx="74" cy="40" r="4" fill="#60A5FA"/>
          <circle cx="26" cy="22" r="3" fill="#3B82F6"/>
          <circle cx="58" cy="58" r="3" fill="#1D4ED8"/>
        </svg>
      </div>
      <div class="login-title">Átomo</div>
      <div class="login-subtitle">PAINEL ADMINISTRATIVO</div>

      <div class="input-group">
        <label>E-mail Admin</label>
        <input id="adminEmail" type="email" placeholder="admin@horus.com">

      <div class="input-group">

  document.getElementById('adminLoginBtn').onclick = function() {

// ============================================================
// PAINEL ADMIN
// ============================================================
function abrirPainel() {
  document.body.innerHTML = `
    <div class="sidebar">
      <svg class="sidebar-logo" width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <defs>

          <filter id="logof3">
            <feGaussianBlur stdDeviation="1.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle cx="40" cy="40" r="10" fill="url(#logoGrad3)" filter="url(#logof3)"/>
        <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.85"/>
        <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.75" transform="rotate(60,40,40)"/>
        <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#1D4ED8" stroke-width="1.5" opacity="0.6" transform="rotate(120,40,40)"/>
        <circle cx="74" cy="40" r="4" fill="#60A5FA"/>
        <circle cx="26" cy="22" r="3" fill="#3B82F6"/>
        <circle cx="58" cy="58" r="3" fill="#1D4ED8"/>
      </svg>
      <h2>ADMIN PANEL</h2>
      <input type="text" id="search" class="search-input" placeholder="🔍 Buscar usuário...">
      <button class="btn-sidebar btn-inicio" onclick="location.href='index.html'">🏠 Página Inicial</button>
      <button class="btn-sidebar btn-logout-admin" onclick="location.href='index.html'">⏻ Sair</button>
    </div>
    <div class="main" id="mainContent">
      <h2>👥 Gerenciamento de Usuários</h2>
      <div class="counters">
        <div class="counter" id="totalUsers"><h3>0</h3><p>Total</p></div>
        <div class="counter" id="approvedUsers"><h3>0</h3><p>Aprovados</p></div>
        <div class="counter" id="pendingUsers"><h3>0</h3><p>Pendentes</p></div>
      </div>
      <div id="usersList"></div>
    </div>
    <div id="toast"></div>
  `;

  document.getElementById('search').addEventListener('input', loadUsers);
  db.collection("pedidos").onSnapshot(() => { loadUsers(); });
  loadUsers();

// ============================================================
// LOAD USERS
// ============================================================
function loadUsers() {
  const searchTerm = document.getElementById('search').value.toLowerCase();
  const usersList  = document.getElementById('usersList');
  if (!usersList) return;
  usersList.innerHTML = "";
  let total = 0, aprovados = 0, pendentes = 0;

  db.collection("pedidos").get().then(snapshot => {
    snapshot.forEach(doc => {
      const data = doc.data();
      if (!data.email || !data.email.toLowerCase().includes(searchTerm)) return;
      total++;
      data.status === "aprovado" ? aprovados++ : pendentes++;
      const statusClass = data.status === "aprovado" ? "status-aprovado" : "status-pendente";
      const div = document.createElement('div');
      div.className = "user-card";
      div.innerHTML = `
        <div>
          <p class="email">${data.email}</p>
          <p class="${statusClass}">● ${data.status.charAt(0).toUpperCase() + data.status.slice(1)}</p>
        </div>
        <div>
          ${data.status === "pendente" ? `<button class="btn-approve" onclick="aprovar('${doc.id}','${data.email}','${data.password}')">✓ Aprovar</button>` : ""}
          <button class="btn-delete" onclick="excluir('${doc.id}')">✕ Excluir</button>
        </div>
      `;
      usersList.appendChild(div);
    });
    document.getElementById('totalUsers').querySelector('h3').innerText = total;
    document.getElementById('approvedUsers').querySelector('h3').innerText = aprovados;
    document.getElementById('pendingUsers').querySelector('h3').innerText = pendentes;
  });
}

// ============================================================
// APROVAR / EXCLUIR
// ============================================================
function aprovar(id, email, password) {
  auth.createUserWithEmailAndPassword(email, password)
    .then(() => db.collection("pedidos").doc(id).update({ status: "aprovado" }))
    .then(() => showToast("✅ " + email + " aprovado!"))
    .catch(err => showToast("❌ Erro: " + err.message, true));
}

function excluir(id) {
  if (confirm("Deseja realmente excluir este usuário?")) {
    db.collection("pedidos").doc(id).delete()
      .then(() => showToast("🗑 Usuário excluído!"))
      .catch(err => showToast("❌ Erro: " + err.message, true));
  }
}

// ============================================================
// ENTER PARA LOGIN
// ============================================================
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const btn = document.getElementById('loginBtn');
    if (btn) btn.click();
  }
});
</script>
