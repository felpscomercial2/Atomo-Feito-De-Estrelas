<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Átomo — Feito de estrelas.</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- Fontes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F1F4F9;
    --bg-card: #FFFFFF;
    --bg-sidebar: #FFFFFF;
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --accent-light: #EFF6FF;
    --accent-glow: rgba(37, 99, 235, 0.15);
    --text: #1E293B;
    --text-muted: #64748B;
    --text-light: #94A3B8;
    --border: #E2E8F0;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.10);
    --success: #16A34A;
    --success-light: #F0FDF4;
    --danger: #DC2626;
    --danger-light: #FEF2F2;
    --warning: #F59E0B;
    --warning-light: #FFFBEB;
  }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* LOGIN */
  .login {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 24px;
  }

  .card {
    background: var(--bg-card);
    padding: 48px 40px;
    border-radius: 20px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    animation: fadeInUp 0.5s ease forwards;
    opacity: 0;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 16px;
    display: block;
  }

  .card h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text);
  }

  .card p {
    color: var(--text-muted);
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 28px;
    margin-top: 2px;
    font-weight: 500;
  }

  .card input {
    width: 100%;
    padding: 14px 16px;
    margin: 6px 0;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }

  .card input::placeholder {
    color: var(--text-light);
  }

  .card input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .btn {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
    letter-spacing: 0.3px;
    font-family: 'DM Sans', sans-serif;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
  }

  .btn-primary:hover {
    background: var(--accent-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(37, 99, 235, 0.35);
  }

  .btn-primary:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none !important;
  }

  .btn-secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background: var(--accent-light);
    border-color: var(--accent);
  }

  .btn-admin {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    margin-top: 6px;
    font-size: 12px;
  }

  .btn-admin:hover {
    background: var(--bg);
    color: var(--text);
  }

  .card-footer {
    margin-top: 20px;
    color: var(--text-light);
    font-size: 11px;
    letter-spacing: 1px;
  }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 16px 24px;
    background: var(--bg-card);
    color: var(--text);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-hover);
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.4s ease;
    z-index: 9999;
    font-size: 14px;
    font-weight: 500;
    max-width: 420px;
  }

  #toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ADMIN PANEL */
  .admin-panel {
    display: none;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px;
    animation: fadeInUp 0.5s ease forwards;
  }

  .admin-panel.show {
    display: block;
  }

  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .admin-header h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
  }

  .admin-header-actions {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .admin-search {
    min-width: 240px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }

  .admin-search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .admin-search::placeholder {
    color: var(--text-light);
  }

  .btn-logout-admin {
    padding: 10px 20px;
    border-radius: 10px;
    background: var(--danger-light);
    color: var(--danger);
    border: 1px solid #FECACA;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .btn-logout-admin:hover {
    background: #FEE2E2;
  }

  .counters {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .counter {
    background: var(--bg-card);
    padding: 20px 24px;
    border-radius: 14px;
    border: 1px solid var(--border);
    text-align: center;
    box-shadow: var(--shadow);
  }

  .counter h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.2;
  }

  .counter p {
    color: var(--text-muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .user-card {
    background: var(--bg-card);
    padding: 16px 20px;
    margin: 8px 0;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid var(--border);
    transition: all 0.2s;
    box-shadow: var(--shadow);
  }

  .user-card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-hover);
  }

  .user-card .email {
    font-weight: 600;
    color: var(--text);
  }

  .user-card .status {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    display: inline-block;
  }

  .status-pendente {
    background: var(--warning-light);
    color: var(--warning);
  }

  .status-aprovado {
    background: var(--success-light);
    color: var(--success);
  }

  .user-actions {
    display: flex;
    gap: 8px;
  }

  .btn-approve {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    background: var(--success-light);
    color: var(--success);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-approve:hover {
    background: #DCFCE7;
  }

  .btn-delete {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    background: var(--danger-light);
    color: var(--danger);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-delete:hover {
    background: #FEE2E2;
  }

  .no-data {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }

  ::-webkit-scrollbar-track {
    background: var(--bg);
  }

  ::-webkit-scrollbar-thumb {
    background: #CBD5E1;
    border-radius: 3px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: #94A3B8;
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .card {
      padding: 32px 24px;
    }

    .counters {
      grid-template-columns: 1fr;
    }

    .admin-header {
      flex-direction: column;
      align-items: stretch;
    }

    .admin-header-actions {
      flex-direction: column;
      align-items: stretch;
    }

    .admin-search {
      min-width: unset;
    }

    .user-card {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }

    .user-actions {
      justify-content: flex-start;
    }
  }

  @media (max-width: 480px) {
    .card {
      padding: 24px 16px;
    }

    .card h1 {
      font-size: 24px;
    }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginScreen">
  <div class="card">
    <svg class="logo" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <circle cx="40" cy="40" r="12" fill="#2563EB" opacity="0.15"/>
      <circle cx="40" cy="40" r="8" fill="#2563EB"/>
      <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.3"/>
      <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.2" transform="rotate(60,40,40)"/>
      <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.15" transform="rotate(120,40,40)"/>
    </svg>
    <h1>Átomo</h1>
    <p>Feito de estrelas.</p>
    <input id="email" placeholder="Email" type="email" autofocus>
    <input id="password" type="password" placeholder="Senha">
    <button class="btn btn-primary" id="loginBtn">Entrar</button>
    <button class="btn btn-secondary" id="registerBtn">Criar conta</button>
    <button class="btn btn-admin" id="adminBtn">⚙ Acesso Admin</button>
    <div class="card-footer">Átomo — Feito de estrelas ✦</div>
  </div>
</div>

<div id="toast"></div>

<script>
const LOGO_B64 = "data:image/png;base64,";

const firebaseConfig = {
  apiKey: "AIzaSyDs1wyLdmz4_2DSt8FXSw-apIeEi0kwzZ4",
  authDomain: "horus-bf93b.firebaseapp.com",
  projectId: "horus-bf93b",
  storageBucket: "horus-bf93b.firebasestorage.app",
  messagingSenderId: "587109575045",
  appId: "1:587109575045:web:0fc32f109aa24399e07cec"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.innerText = msg;
  toast.className = 'show';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => { toast.className = ''; }, 3000);
}

// ============================================================
// FUNÇÃO DE LOGIN (reutilizada pelo clique e pelo Enter)
// ============================================================
function realizarLogin() {
  const btn = document.getElementById('loginBtn');
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  // Validação básica
  if (!email || !password) {
    showToast("❌ Preencha email e senha.");
    return;
  }

  btn.textContent = 'Entrando...';
  btn.disabled = true;

  auth.signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
      localStorage.setItem('horus_user_email', userCredential.user.email);
      window.location.href = 'home.html';
    })
    .catch(err => {
      btn.textContent = 'Entrar';
      btn.disabled = false;
      showToast("❌ Erro no login: " + err.message);
    });
}

// ============================================================
// EVENTO DE CLIQUE NO BOTÃO "ENTRAR"
// ============================================================
document.getElementById("loginBtn").onclick = realizarLogin;

// ============================================================
// EVENTO DE TECLA "ENTER" NOS CAMPOS EMAIL E SENHA
// ============================================================
document.getElementById("email").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    document.getElementById("password").focus();
  }
});

document.getElementById("password").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    realizarLogin();
  }
});

// ============================================================
// REGISTER
// ============================================================
document.getElementById("registerBtn").onclick = function() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if (!email || !password) {
    showToast("❌ Preencha email e senha.");
    return;
  }
  db.collection("pedidos").add({ email, password, status: "pendente" })
    .then(() => showToast("✅ Pedido enviado! Aguarde aprovação."))
    .catch(err => showToast("❌ Erro: " + err.message));
};

// ============================================================
// ADMIN LOGIN
// ============================================================
document.getElementById("adminBtn").onclick = function() {
  document.getElementById("loginScreen").innerHTML = `
    <div class="card">
      <svg class="logo" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <circle cx="40" cy="40" r="12" fill="#2563EB" opacity="0.15"/>
        <circle cx="40" cy="40" r="8" fill="#2563EB"/>
        <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.3"/>
        <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.2" transform="rotate(60,40,40)"/>
        <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.15" transform="rotate(120,40,40)"/>
      </svg>
      <h1>Átomo</h1>
      <p>PAINEL ADMINISTRATIVO</p>
      <input id="adminEmail" placeholder="Email Admin" type="email">
      <input id="adminPassword" type="password" placeholder="Senha Admin">
      <button class="btn btn-primary" id="adminLoginBtn">Entrar</button>
      <button class="btn btn-secondary" onclick="location.reload()">↩ Voltar</button>
    </div>
  `;

  // Também adiciona Enter para o login admin
  document.getElementById("adminEmail").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("adminPassword").focus();
    }
  });

  document.getElementById("adminPassword").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("adminLoginBtn").click();
    }
  });

  document.getElementById("adminLoginBtn").onclick = function() {
    const email = document.getElementById('adminEmail').value;
    const password = document.getElementById('adminPassword').value;
    if (email === "admin@horus.com" && password === "Admin123!") {
      abrirPainel();
    } else {
      showToast("❌ Credenciais incorretas!");
    }
  };
};

function abrirPainel() {
  document.body.innerHTML = `
    <div class="admin-panel show">
      <div class="admin-header">
        <h2>👥 Gerenciamento de Usuários</h2>
        <div class="admin-header-actions">
          <input type="text" id="search" class="admin-search" placeholder="🔍 Buscar usuário...">
          <button class="btn-logout-admin" onclick="window.location.href='index.html'">⏻ Sair</button>
        </div>
      </div>

      <div class="counters">
        <div class="counter" id="totalUsers"><h3>0</h3><p>Total</p></div>
        <div class="counter" id="approvedUsers"><h3>0</h3><p>Aprovados</p></div>
        <div class="counter" id="pendingUsers"><h3>0</h3><p>Pendentes</p></div>
      </div>

      <div id="usersList"></div>
    </div>
    <div id="toast"></div>
  `;

  document.getElementById('search').addEventListener('input', loadUsers);
  db.collection("pedidos").onSnapshot(() => { loadUsers(); });
  loadUsers();
}

function loadUsers() {
  const searchTerm = document.getElementById('search')?.value.toLowerCase() || '';
  const usersList = document.getElementById('usersList');
  if (!usersList) return;

  usersList.innerHTML = '';
  let total = 0, aprovados = 0, pendentes = 0;

  db.collection("pedidos").get().then(snapshot => {
    snapshot.forEach(doc => {
      const data = doc.data();
      if (!data.email.toLowerCase().includes(searchTerm)) return;
      total++;
      data.status === "aprovado" ? aprovados++ : pendentes++;

      const div = document.createElement('div');
      div.className = "user-card";
      div.innerHTML = `
        <div>
          <div class="email">${data.email}</div>
          <span class="status ${data.status === 'aprovado' ? 'status-aprovado' : 'status-pendente'}">
            ● ${data.status.charAt(0).toUpperCase() + data.status.slice(1)}
          </span>
        </div>
        <div class="user-actions">
          ${data.status === "pendente" ? `<button class="btn-approve" onclick="aprovar('${doc.id}','${data.email}','${data.password}')">✓ Aprovar</button>` : ""}
          <button class="btn-delete" onclick="excluir('${doc.id}')">✕ Excluir</button>
        </div>
      `;
      usersList.appendChild(div);
    });

    document.getElementById('totalUsers').querySelector('h3').innerText = total;
    document.getElementById('approvedUsers').querySelector('h3').innerText = aprovados;
    document.getElementById('pendingUsers').querySelector('h3').innerText = pendentes;
  });
}

function aprovar(id, email, password) {
  auth.createUserWithEmailAndPassword(email, password)
    .then(() => db.collection("pedidos").doc(id).update({ status: "aprovado" }))
    .then(() => showToast("✅ " + email + " aprovado!"))
    .catch(err => showToast("❌ Erro: " + err.message));
}

function excluir(id) {
  if (confirm("Deseja realmente excluir este usuário?")) {
    db.collection("pedidos").doc(id).delete()
      .then(() => showToast("🗑 Usuário excluído!"));
  }
}
</script>

</body>
</html>
