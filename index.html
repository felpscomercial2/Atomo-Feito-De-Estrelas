<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Átomo Feito de estrelas.</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-main:      #060e1f;
    --bg-card:      #0f2040;
    --bg-sidebar:   #0d2b5e;
    --accent:       #1a5cb8;
    --accent-hover: #2170d4;
    --text:         #F5F5F5;
    --text-muted:   #a0aec0;
    --border:       rgba(255,255,255,0.07);
    --success:      #00ff88;
    --warning:      #ffaa00;
    --danger:       #ff4d4d;
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg-main);
    color: var(--text);
    min-height: 100vh;
  }

  /* LOGIN */
  .login {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: radial-gradient(ellipse at 50% 40%, #1a3a6b 0%, #0d1e3d 45%, #060e1f 100%);
  }

  .card {
    background: var(--bg-card);
    padding: 40px 36px;
    border-radius: 18px;
    width: 340px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: 0 8px 40px rgba(1,95,184,0.15);
  }

  .logo-img {
    width: 140px;
    height: auto;
    margin-bottom: 8px;
    filter: drop-shadow(0 2px 12px rgba(1,95,184,0.4));
  }

  .card h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #fff;
  }

  .card p {
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 24px;
    margin-top: 2px;
  }

  .card input {
    width: 100%;
    padding: 12px 14px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
  }
  .card input:focus { border-color: var(--accent); }
  .card input::placeholder { color: var(--text-muted); }

  .btn {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
  .btn-secondary:hover { background: rgba(1,95,184,0.1); }
  .btn-admin { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border); margin-top: 6px; font-size: 12px; }
  .btn-admin:hover { background: rgba(255,255,255,0.08); color: var(--text); }

  /* ADMIN PANEL */
  .sidebar {
    width: 240px; background: var(--bg-sidebar); position: fixed;
    top: 0; left: 0; height: 100vh; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
    border-right: 1px solid var(--border);
  }
  .sidebar-logo { width: 110px; margin-bottom: 6px; filter: drop-shadow(0 2px 8px rgba(1,95,184,0.3)); }
  .sidebar h2 { font-size: 11px; letter-spacing: 3px; color: var(--text-muted); margin-bottom: 24px; }
  .search-input {
    width: 100%; padding: 9px 12px; margin-bottom: 12px;
    border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.05); color: var(--text);
    font-size: 13px; outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-muted); }
  .btn-sidebar {
    width: 100%; padding: 9px 12px; margin: 4px 0;
    border-radius: 8px; border: 1px solid rgba(1,95,184,0.2);
    cursor: pointer; font-size: 13px; font-weight: 500;
    text-align: left; transition: all 0.2s;
    background: rgba(1,95,184,0.12); color: var(--text);
  }
  .btn-sidebar:hover { background: rgba(1,95,184,0.25); border-color: var(--accent); }
  .btn-inicio {
    background: rgba(0,195,255,0.1) !important;
    color: #00c3ff !important;
    border-color: rgba(0,195,255,0.2) !important;
  }
  .btn-inicio:hover { background: rgba(0,195,255,0.2) !important; }
  .btn-logout-admin {
    background: rgba(255,77,77,0.1) !important;
    color: var(--danger) !important;
    border-color: rgba(255,77,77,0.2) !important;
    margin-top: auto;
  }
  .btn-logout-admin:hover { background: rgba(255,77,77,0.2) !important; }

  .main { margin-left: 260px; padding: 30px; }
  .main h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }

  .counters { display: flex; gap: 16px; margin-bottom: 24px; }
  .counter {
    flex: 1; background: var(--bg-card); padding: 20px;
    border-radius: 12px; text-align: center; border: 1px solid var(--border);
  }
  .counter h3 { font-size: 28px; font-weight: 700; color: var(--accent); }
  .counter p { font-size: 12px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

  .user-card {
    background: var(--bg-card); padding: 16px 20px; margin: 8px 0;
    border-radius: 10px; display: flex; justify-content: space-between;
    align-items: center; border: 1px solid var(--border); transition: all 0.2s;
  }
  .user-card:hover { border-color: rgba(1,95,184,0.3); }
  .user-card p { margin: 0; font-size: 14px; }
  .email { font-weight: 600; }
  .status-aprovado { color: var(--success); font-size: 13px; }
  .status-pendente { color: var(--warning); font-size: 13px; }
  .btn-approve {
    background: rgba(0,255,136,0.1); color: var(--success);
    border: 1px solid rgba(0,255,136,0.2); padding: 7px 14px;
    border-radius: 6px; cursor: pointer; font-size: 12px;
    font-weight: 600; margin-left: 8px; transition: all 0.2s;
  }
  .btn-approve:hover { background: rgba(0,255,136,0.2); }
  .btn-delete {
    background: rgba(255,77,77,0.1); color: var(--danger);
    border: 1px solid rgba(255,77,77,0.2); padding: 7px 14px;
    border-radius: 6px; cursor: pointer; font-size: 12px;
    font-weight: 600; margin-left: 8px; transition: all 0.2s;
  }
  .btn-delete:hover { background: rgba(255,77,77,0.2); }

  /* TOAST */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 14px 22px; background: var(--accent); color: #fff;
    border-radius: 10px; opacity: 0; transform: translateY(50px);
    transition: all 0.4s; z-index: 9999; font-size: 14px;
    font-weight: 500; box-shadow: 0 4px 20px rgba(1,95,184,0.4);
  }
  #toast.show { opacity: 1; transform: translateY(0); }

/* ═══ ÁTOMO — Loading Screen ═══ */
.loading-overlay,.loading-global{
  display:none;position:fixed;inset:0;z-index:9999;
  align-items:center;justify-content:center;flex-direction:column;gap:28px;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%,   rgba(192,64,255,0.18) 0%,transparent 55%),
    radial-gradient(ellipse 60% 50% at -10% 60%,  rgba(255,50,120,0.14) 0%,transparent 50%),
    radial-gradient(ellipse 60% 50% at 110% 60%,  rgba(0,200,255,0.12) 0%,transparent 50%),
    radial-gradient(ellipse 80% 40% at 50% 110%,  rgba(140,0,255,0.18) 0%,transparent 55%),
    #02000A;
}
.loading-overlay.show,.loading-global.show{display:flex;}
.lo-particles{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle 1px at 8% 12%,rgba(255,255,255,0.9) 0%,transparent 100%),
    radial-gradient(circle 1.5px at 20% 5%,rgba(255,100,160,0.8) 0%,transparent 100%),
    radial-gradient(circle 1px at 33% 18%,rgba(255,255,255,0.7) 0%,transparent 100%),
    radial-gradient(circle 1px at 48% 8%,rgba(0,220,255,0.8) 0%,transparent 100%),
    radial-gradient(circle 1.5px at 62% 15%,rgba(255,255,255,0.6) 0%,transparent 100%),
    radial-gradient(circle 1px at 75% 6%,rgba(180,60,255,0.8) 0%,transparent 100%),
    radial-gradient(circle 1px at 88% 20%,rgba(255,255,255,0.7) 0%,transparent 100%),
    radial-gradient(circle 1px at 5% 45%,rgba(255,255,255,0.6) 0%,transparent 100%),
    radial-gradient(circle 1.5px at 15% 60%,rgba(255,60,140,0.7) 0%,transparent 100%),
    radial-gradient(circle 1px at 42% 55%,rgba(0,200,255,0.7) 0%,transparent 100%),
    radial-gradient(circle 1.5px at 58% 68%,rgba(255,255,255,0.8) 0%,transparent 100%),
    radial-gradient(circle 1px at 72% 50%,rgba(180,60,255,0.6) 0%,transparent 100%),
    radial-gradient(circle 1px at 90% 48%,rgba(0,255,180,0.6) 0%,transparent 100%),
    radial-gradient(circle 1.5px at 35% 90%,rgba(255,100,160,0.7) 0%,transparent 100%),
    radial-gradient(circle 1px at 80% 88%,rgba(0,200,255,0.6) 0%,transparent 100%);
}
.loading-scene{position:relative;width:320px;height:320px;display:flex;align-items:center;justify-content:center;}
.lo-atom-svg{position:absolute;top:0;left:0;width:320px;height:320px;overflow:visible;}
.lo-nucleus-circle{animation:nucleusPulse 2.5s ease-in-out infinite;transform-origin:160px 160px;}
@keyframes nucleusPulse{
  0%,100%{filter:drop-shadow(0 0 8px rgba(192,64,255,1)) drop-shadow(0 0 20px rgba(255,60,140,0.6));}
  50%{filter:drop-shadow(0 0 16px rgba(192,64,255,1)) drop-shadow(0 0 40px rgba(255,60,140,0.8));}
}
.lo-group-1{animation:groupSpin1 3s linear infinite;transform-origin:160px 160px;}
.lo-group-2{animation:groupSpin2 5s linear infinite;transform-origin:160px 160px;}
.lo-group-3{animation:groupSpin3 7s linear infinite;transform-origin:160px 160px;}
@keyframes groupSpin1{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes groupSpin2{from{transform:rotate(60deg);}to{transform:rotate(420deg);}}
@keyframes groupSpin3{from{transform:rotate(120deg);}to{transform:rotate(480deg);}}
.lo-electron{animation:electronPulse 1.5s ease-in-out infinite;}
.lo-electron-1{animation-delay:0s;}
.lo-electron-2{animation-delay:0.5s;}
.lo-electron-3{animation-delay:1s;}
@keyframes electronPulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
.lo-text{display:flex;flex-direction:column;align-items:center;gap:8px;z-index:10;}
.lo-title{
  font-family:'Space Grotesk',sans-serif !important;
  font-size:24px;font-weight:700;letter-spacing:8px;text-transform:uppercase;
  background:linear-gradient(135deg,#F0D0FF 0%,#FF60A0 35%,#C040FF 65%,#00C8FF 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  background-size:200% auto;animation:titleShimmer 3s linear infinite;
}
@keyframes titleShimmer{0%{background-position:0% center;}100%{background-position:200% center;}}
.lo-sub{font-size:11px;letter-spacing:5px;color:rgba(192,64,255,0.8);text-transform:uppercase;text-shadow:0 0 10px rgba(192,64,255,0.5);}
.lo-progress{width:200px;height:2px;background:rgba(192,64,255,0.1);border-radius:2px;overflow:hidden;position:relative;}
.lo-progress-bar{position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,#C040FF,#FF3C8C,#00C8FF,transparent);animation:progressSlide 2s linear infinite;box-shadow:0 0 10px rgba(192,64,255,0.8);}
@keyframes progressSlide{0%{left:-100%;}100%{left:100%;}}

/* ═══════════════════════════════════════════════════
   ÁTOMO — Galáxia Vibrante · Feito de estrelas.
═══════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

body,*{font-family:'DM Sans',system-ui,sans-serif !important;}
h1,h2,h3,.page-title,.sidebar-title,.lo-title{font-family:'Space Grotesk',system-ui,sans-serif !important;}

body{
  background-color:#02000A !important;
  background-image:
    radial-gradient(ellipse 65% 45% at -5% 15%,rgba(255,50,120,0.22) 0%,rgba(200,30,100,0.12) 35%,transparent 65%),
    radial-gradient(ellipse 55% 55% at 105% 35%,rgba(0,220,255,0.20) 0%,rgba(0,150,220,0.10) 40%,transparent 65%),
    radial-gradient(ellipse 80% 45% at 50% 105%,rgba(140,0,255,0.25) 0%,rgba(100,0,200,0.12) 40%,transparent 60%),
    radial-gradient(ellipse 70% 35% at 50% -8%,rgba(180,0,255,0.20) 0%,rgba(130,30,220,0.10) 40%,transparent 60%),
    #02000A !important;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(circle 1px at 5% 8%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 12% 22%,#fff 0%,transparent 100%),
    radial-gradient(circle 2px at 18% 5%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 25% 35%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 32% 14%,#fff 0%,transparent 100%),
    radial-gradient(circle 2px at 38% 28%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 44% 8%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 50% 42%,#fff 0%,transparent 100%),
    radial-gradient(circle 2px at 57% 18%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 63% 5%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 70% 32%,#fff 0%,transparent 100%),
    radial-gradient(circle 2px at 76% 12%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 82% 25%,#fff 0%,transparent 100%),
    radial-gradient(circle 2px at 88% 8%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 94% 20%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 8% 55%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 22% 68%,#fff 0%,transparent 100%),
    radial-gradient(circle 2px at 35% 58%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 48% 72%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 62% 55%,#fff 0%,transparent 100%),
    radial-gradient(circle 2px at 75% 68%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 88% 58%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 15% 85%,#fff 0%,transparent 100%),
    radial-gradient(circle 2px at 40% 92%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 65% 88%,#fff 0%,transparent 100%),
    radial-gradient(circle 1px at 90% 82%,#fff 0%,transparent 100%),
    radial-gradient(circle 2.5px at 20% 30%,rgba(0,220,255,0.95) 0%,transparent 100%),
    radial-gradient(circle 2.5px at 75% 20%,rgba(255,60,140,0.95) 0%,transparent 100%),
    radial-gradient(circle 2px at 50% 60%,rgba(180,60,255,0.9) 0%,transparent 100%),
    radial-gradient(circle 2.5px at 30% 75%,rgba(0,255,180,0.9) 0%,transparent 100%),
    radial-gradient(circle 2px at 85% 50%,rgba(255,140,0,0.85) 0%,transparent 100%),
    radial-gradient(circle 3px at 45% 15%,rgba(255,60,140,0.7) 0%,transparent 100%),
    radial-gradient(circle 2px at 92% 70%,rgba(0,220,255,0.85) 0%,transparent 100%);
}

/* Sidebar */
.sidebar{background:linear-gradient(180deg,rgba(60,0,100,0.95),rgba(30,0,70,0.98) 40%,rgba(10,0,40,1)) !important;border-right:1px solid rgba(192,64,255,0.25) !important;box-shadow:4px 0 40px rgba(0,0,0,0.8),inset -1px 0 0 rgba(255,60,140,0.1) !important;}
.nav-item{color:rgba(180,150,255,0.6) !important;transition:all 0.2s !important;}
.nav-item:hover{color:#E0C8FF !important;background:rgba(180,60,255,0.1) !important;text-shadow:0 0 12px rgba(180,60,255,0.5) !important;}
.nav-item.active{background:linear-gradient(90deg,rgba(180,60,255,0.2),rgba(255,60,140,0.1)) !important;color:#F0D0FF !important;border-left:2px solid #C040FF !important;text-shadow:0 0 16px rgba(180,60,255,0.6) !important;}
.sidebar-title{letter-spacing:4px !important;background:linear-gradient(135deg,#F0D0FF,#FF60A0,#C040FF) !important;-webkit-background-clip:text !important;-webkit-text-fill-color:transparent !important;background-clip:text !important;}

/* Cards */
.card,.kpi-card,.chart-card,.filter-card,.upload-card,.table-wrap,.modal-box,.busca-card{
  background:linear-gradient(135deg,rgba(40,5,80,0.92),rgba(20,2,50,0.95) 50%,rgba(5,0,30,0.97)) !important;
  border:1px solid rgba(192,64,255,0.2) !important;border-radius:16px !important;
  box-shadow:0 4px 30px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.04) !important;
  backdrop-filter:blur(12px) !important;
}

/* KPI — NÃO força font-size */
.kpi-card::before{background:linear-gradient(180deg,#C040FF,#FF60A0) !important;}
.kpi-card.critico::before,.kpi-card.vermelho::before{background:linear-gradient(180deg,#FF2060,#FF6040) !important;}
.kpi-card.atencao::before,.kpi-card.amarelo::before{background:linear-gradient(180deg,#FF8C00,#FFB040) !important;}
.kpi-card.ok::before,.kpi-card.verde::before{background:linear-gradient(180deg,#00FFB0,#00D4FF) !important;}
.kpi-card.ciano::before{background:linear-gradient(180deg,#00C8FF,#00FFB0) !important;}
.kpi-card.sl::before{background:linear-gradient(180deg,#C040FF,#7000CC) !important;}
.kpi-value{
  color:#F0D0FF !important;
  text-shadow:0 0 20px rgba(180,60,255,0.3) !important;
  word-break:normal !important;white-space:nowrap !important;
  overflow:hidden !important;text-overflow:ellipsis !important;
}
.kpi-label{color:rgba(180,150,255,0.6) !important;font-weight:700 !important;text-transform:uppercase !important;letter-spacing:.1em !important;}
.kpi-sub{color:rgba(180,150,255,0.5) !important;}

/* Badges */
.badge{border-radius:8px !important;font-weight:700 !important;}
.badge-critico{background:rgba(255,32,96,0.18) !important;color:#FF80A8 !important;border:1px solid rgba(255,32,96,0.45) !important;box-shadow:0 0 12px rgba(255,32,96,0.2) !important;text-shadow:0 0 8px rgba(255,60,120,0.6) !important;}
.badge-atencao{background:rgba(255,140,0,0.18) !important;color:#FFB060 !important;border:1px solid rgba(255,140,0,0.45) !important;}
.badge-ok{background:rgba(0,255,176,0.15) !important;color:#40FFD0 !important;border:1px solid rgba(0,255,176,0.4) !important;box-shadow:0 0 12px rgba(0,255,176,0.2) !important;text-shadow:0 0 8px rgba(0,255,176,0.5) !important;}
.badge-sl{background:rgba(192,64,255,0.2) !important;color:#E080FF !important;border:1px solid rgba(192,64,255,0.5) !important;box-shadow:0 0 14px rgba(192,64,255,0.3) !important;text-shadow:0 0 10px rgba(192,64,255,0.7) !important;}

/* Botões */
.btn-primary,.btn-save,.btn-buscar{background:linear-gradient(135deg,#7000CC,#C040FF,#FF60A0) !important;border:none !important;box-shadow:0 4px 20px rgba(192,64,255,0.5) !important;color:#fff !important;font-weight:700 !important;transition:all 0.2s !important;}
.btn-primary:hover,.btn-save:hover,.btn-buscar:hover{transform:translateY(-2px) !important;box-shadow:0 8px 30px rgba(192,64,255,0.7) !important;}
.btn-logout{background:rgba(255,32,96,0.12) !important;color:#FF80A8 !important;border:1px solid rgba(255,32,96,0.25) !important;}

/* Tabela */
table thead th{background:rgba(5,0,25,0.95) !important;color:#9060CC !important;font-weight:700 !important;letter-spacing:.1em !important;font-size:10px !important;border-bottom:1px solid rgba(192,64,255,0.2) !important;}
table tbody tr:hover{background:rgba(192,64,255,0.07) !important;}
table tbody td{border-bottom:1px solid rgba(255,255,255,0.03) !important;color:#D0C0F0 !important;}

/* Inputs */
input,select,textarea,.td-input,.td-date,.td-select,.td-textarea,.busca-input{
  background:rgba(20,5,50,0.9) !important;border:1px solid rgba(192,64,255,0.25) !important;
  color:#E8D8FF !important;border-radius:8px !important;transition:all 0.2s !important;
}
input::placeholder,.busca-input::placeholder{color:rgba(180,150,255,0.4) !important;}
input:focus,select:focus,textarea:focus,.td-input:focus,.td-date:focus,.td-select:focus,.busca-input:focus{
  border-color:#C040FF !important;box-shadow:0 0 0 3px rgba(192,64,255,0.2),0 0 15px rgba(192,64,255,0.2) !important;outline:none !important;
}

/* Filtros */
.filtro-btn,.acao-filtro-btn{background:rgba(192,64,255,0.08) !important;border:1px solid rgba(192,64,255,0.25) !important;color:rgba(180,130,255,0.8) !important;border-radius:10px !important;}
.filtro-btn:hover,.acao-filtro-btn:hover{border-color:#C040FF !important;background:rgba(192,64,255,0.18) !important;color:#E8D8FF !important;box-shadow:0 0 15px rgba(192,64,255,0.2) !important;}
.filtro-btn.ativo,.acao-filtro-btn.tem-filtro{background:rgba(192,64,255,0.22) !important;border-color:#C040FF !important;color:#F0D8FF !important;box-shadow:0 0 20px rgba(192,64,255,0.3) !important;}

/* Tags busca */

.sugestao-item:hover{background:rgba(192,64,255,0.12) !important;}
.produto-tag{background:rgba(0,200,255,0.1) !important;border:1px solid rgba(0,200,255,0.3) !important;color:#60E8FF !important;border-radius:20px !important;}

.dias-ok{color:#40FFD0 !important;font-weight:600 !important;text-shadow:0 0 8px rgba(0,255,176,0.5) !important;}

/* Tags comparação */

.tag-aumentou{background:rgba(0,200,255,0.15) !important;color:#60E8FF !important;border:1px solid rgba(0,200,255,0.4) !important;border-radius:6px !important;}
.tag-reduziu{background:rgba(0,255,176,0.12) !important;color:#40FFD0 !important;border:1px solid rgba(0,255,176,0.35) !important;border-radius:6px !important;}

/* Row states */

.row-sl-novo{background:rgba(192,64,255,0.08) !important;border-left:3px solid #C040FF !important;box-shadow:inset 3px 0 12px rgba(192,64,255,0.12) !important;}
.row-aumentou{background:rgba(0,200,255,0.05) !important;}
.row-reduziu{background:rgba(0,255,176,0.04) !important;}

/* Upload */
.upload-card{border:1px dashed rgba(192,64,255,0.35) !important;background:rgba(40,5,80,0.4) !important;}
.upload-card:hover{border-color:#C040FF !important;box-shadow:0 0 30px rgba(192,64,255,0.2) !important;}

/* Dropdowns */
.acao-dropdown,.vend-dropdown,[class*="dropdown"]{background:linear-gradient(135deg,rgba(40,5,80,0.98),rgba(20,2,50,0.99)) !important;border:1px solid rgba(192,64,255,0.3) !important;border-radius:12px !important;box-shadow:0 12px 40px rgba(0,0,0,0.8) !important;}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:#02000A;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#7000CC,#C040FF);border-radius:3px;box-shadow:0 0 6px rgba(192,64,255,0.5);}

/* Textos */
h1,h2,.page-title{color:#F0D0FF !important;text-shadow:0 0 20px rgba(192,64,255,0.2) !important;}
body,p,span,div,td,th,li,label{color:#D0C0F0;}
.muted,[class*="muted"]{color:rgba(180,150,255,0.55) !important;}

/* Logo glow */
.sidebar-logo,.sidebar svg{
  filter:drop-shadow(0 0 8px rgba(192,64,255,0.6)) drop-shadow(0 0 16px rgba(255,60,140,0.3)) !important;
  animation:logoGlow 3s ease-in-out infinite !important;
}
@keyframes logoGlow{
  0%,100%{filter:drop-shadow(0 0 6px rgba(192,64,255,0.5)) drop-shadow(0 0 12px rgba(255,60,140,0.25));}
  50%{filter:drop-shadow(0 0 14px rgba(192,64,255,0.9)) drop-shadow(0 0 28px rgba(255,60,140,0.5));}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginScreen">
  <div class="card">
    
    <h1>Átomo</h1>
    <p>Feito de estrelas.</p>
    <input id="email" placeholder="Email" type="email">
    <input id="password" type="password" placeholder="Senha">
    <button class="btn btn-primary" id="loginBtn">Entrar</button>
    <button class="btn btn-secondary" id="registerBtn">Criar conta</button>
    <button class="btn btn-admin" id="adminBtn">⚙ Acesso Admin</button>
  </div>
</div>

<div id="toast"></div>

<script>
const LOGO_B64 = "data:image/png;base64,";

const firebaseConfig = {
  apiKey: "AIzaSyDs1wyLdmz4_2DSt8FXSw-apIeEi0kwzZ4",
  authDomain: "horus-bf93b.firebaseapp.com",
  projectId: "horus-bf93b",
  storageBucket: "horus-bf93b.firebasestorage.app",
  messagingSenderId: "587109575045",
  appId: "1:587109575045:web:0fc32f109aa24399e07cec"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// --- LOGIN NORMAL → redireciona para home.html ---
document.getElementById("loginBtn").onclick = function() {
  const email    = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  auth.signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
      localStorage.setItem('horus_user_email', userCredential.user.email);
      location.href = 'home.html';
    })
    .catch(err => showToast("❌ Erro no login: " + err.message));
};

// --- CRIAR CONTA ---
document.getElementById("registerBtn").onclick = function() {
  const email    = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  db.collection("pedidos").add({ email, password, status: "pendente" })
    .then(() => showToast("✅ Pedido enviado! Aguarde aprovação."))
    .catch(err => showToast("❌ Erro: " + err.message));
};

// --- LOGIN ADMIN ---
document.getElementById("adminBtn").onclick = function() {
  document.getElementById("loginScreen").innerHTML = `
    <div class="card">
      <img src="${LOGO_B64}" class="logo-img" alt="Horus Logo">
      <h1>HORUS</h1>
      <p>PAINEL ADMINISTRATIVO</p>
      <input id="adminEmail" placeholder="Email Admin" type="email">
      <input id="adminPassword" type="password" placeholder="Senha Admin">
      <button class="btn btn-primary" id="adminLoginBtn">Entrar</button>
    </div>
  `;
  document.getElementById("adminLoginBtn").onclick = adminLoginSecure;
};

function adminLoginSecure() {
  const email    = document.getElementById('adminEmail').value;
  const password = document.getElementById('adminPassword').value;
  if (email === "admin@horus.com" && password === "Admin123!") abrirPainel();
  else showToast("❌ Credenciais incorretas!");
}

// --- PAINEL ADMIN ---
function abrirPainel() {
  document.body.innerHTML = `
    <div class="sidebar">
      <svg class="sidebar-logo" width="80" height="80" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="display:block;">
  <defs>
    <radialGradient id="ngindex_html" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#E8E0FF"/>
      <stop offset="50%" stop-color="#C040FF"/>
      <stop offset="100%" stop-color="#7000CC"/>
    </radialGradient>
    <filter id="gfindex_html">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="10" fill="url(#ngindex_html)" filter="url(#gfindex_html)"/>
  <ellipse cx="50" cy="50" rx="42" ry="15" fill="none" stroke="#FF3C8C" stroke-width="1.5" opacity="0.85"/>
  <ellipse cx="50" cy="50" rx="42" ry="15" fill="none" stroke="#C040FF" stroke-width="1.5" opacity="0.75" transform="rotate(60,50,50)"/>
  <ellipse cx="50" cy="50" rx="42" ry="15" fill="none" stroke="#00C8FF" stroke-width="1.5" opacity="0.6" transform="rotate(120,50,50)"/>
  <circle cx="92" cy="50" r="4.5" fill="#FF3C8C"/>
  <circle cx="29" cy="26" r="3.5" fill="#C040FF"/>
  <circle cx="71" cy="73" r="3.5" fill="#00C8FF"/>
</svg>
      <h2>ADMIN PANEL</h2>
      <input type="text" id="search" class="search-input" placeholder="🔍 Buscar usuário...">
      <button class="btn-sidebar btn-inicio" onclick="location.href='index.html'">🏠 Página Inicial</button>
      <button class="btn-sidebar btn-logout-admin" onclick="location.href='index.html'" style="margin-top:auto">⏻ Sair</button>
    </div>
    <div class="main" id="mainContent">
      <h2>👥 Gerenciamento de Usuários</h2>
      <div class="counters">
        <div class="counter" id="totalUsers"><h3>0</h3><p>Total</p></div>
        <div class="counter" id="approvedUsers"><h3>0</h3><p>Aprovados</p></div>
        <div class="counter" id="pendingUsers"><h3>0</h3><p>Pendentes</p></div>
      </div>
      <div id="usersList"></div>
    </div>
    <div id="toast"></div>
  `;
  document.getElementById('search').addEventListener('input', loadUsers);
  db.collection("pedidos").onSnapshot(() => { loadUsers(); });
  loadUsers();
}

function loadUsers() {
  const searchTerm = document.getElementById('search').value.toLowerCase();
  const usersList  = document.getElementById('usersList');
  usersList.innerHTML = "";
  let total = 0, aprovados = 0, pendentes = 0;

  db.collection("pedidos").get().then(snapshot => {
    snapshot.forEach(doc => {
      const data = doc.data();
      if (!data.email.toLowerCase().includes(searchTerm)) return;
      total++;
      data.status === "aprovado" ? aprovados++ : pendentes++;
      const statusClass = data.status === "aprovado" ? "status-aprovado" : "status-pendente";
      const div = document.createElement('div');
      div.className = "user-card";
      div.innerHTML = `
        <div>
          <p class="email">${data.email}</p>
          <p class="${statusClass}">● ${data.status.charAt(0).toUpperCase() + data.status.slice(1)}</p>
        </div>
        <div>
          ${data.status === "pendente" ? `<button class="btn-approve" onclick="aprovar('${doc.id}','${data.email}','${data.password}')">✓ Aprovar</button>` : ""}
          <button class="btn-delete" onclick="excluir('${doc.id}')">✕ Excluir</button>
        </div>
      `;
      usersList.appendChild(div);
    });
    document.getElementById('totalUsers').querySelector('h3').innerText    = total;
    document.getElementById('approvedUsers').querySelector('h3').innerText = aprovados;
    document.getElementById('pendingUsers').querySelector('h3').innerText  = pendentes;
  });
}

function aprovar(id, email, password) {
  auth.createUserWithEmailAndPassword(email, password)
    .then(() => db.collection("pedidos").doc(id).update({ status: "aprovado" }))
    .then(() => showToast("✅ " + email + " aprovado!"))
    .catch(err => showToast("❌ Erro: " + err.message));
}

function excluir(id) {
  if (confirm("Deseja realmente excluir este usuário?")) {
    db.collection("pedidos").doc(id).delete()
      .then(() => showToast("🗑 Usuário excluído!"));
  }
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.innerText = msg;
  toast.className = 'show';
  setTimeout(() => { toast.className = ''; }, 3000);
}
</script>
</body>
</html>
