<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Átomo — Feito de estrelas.</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- Fontes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0B0F19;
    --bg-card: #131B2E;
    --bg-sidebar: #0E1628;
    --accent: #7C3AED;
    --accent-hover: #6D28D9;
    --accent-glow: rgba(124, 58, 237, 0.4);
    --text: #F1F5F9;
    --text-muted: #94A3B8;
    --border: rgba(124, 58, 237, 0.15);
    --success: #10B981;
    --danger: #EF4444;
    --warning: #F59E0B;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(124, 58, 237, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(59, 130, 246, 0.06) 0%, transparent 60%);
  }

  /* LOGIN */
  .login {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 24px;
  }

  .card {
    background: var(--bg-card);
    padding: 48px 40px;
    border-radius: 20px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(124, 58, 237, 0.05);
    backdrop-filter: blur(12px);
    animation: fadeInUp 0.6s ease forwards;
    opacity: 0;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    width: 80px;
    height: 80px;
    margin: 0 auto 16px;
    display: block;
  }

  .card h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #A78BFA, #7C3AED, #6D28D9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .card p {
    color: var(--text-muted);
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 28px;
    margin-top: 4px;
    font-weight: 500;
  }

  .card input {
    width: 100%;
    padding: 14px 16px;
    margin: 6px 0;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }

  .card input::placeholder {
    color: var(--text-muted);
    opacity: 0.6;
  }

  .card input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .btn {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    font-family: 'DM Sans', sans-serif;
  }

  .btn-primary {
    background: linear-gradient(135deg, #7C3AED, #6D28D9);
    color: #fff;
    box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 30px rgba(124, 58, 237, 0.6);
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.08);
  }

  .btn-admin {
    background: rgba(255, 255, 255, 0.02);
    color: var(--text-muted);
    border: 1px solid rgba(255, 255, 255, 0.05);
    margin-top: 6px;
    font-size: 12px;
  }

  .btn-admin:hover {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
  }

  .card-footer {
    margin-top: 20px;
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 1px;
    opacity: 0.6;
  }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 16px 24px;
    background: var(--bg-card);
    color: var(--text);
    border-radius: 12px;
    border: 1px solid var(--border);
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.4s ease;
    z-index: 9999;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(12px);
  }

  #toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ADMIN PANEL */
  .admin-panel {
    display: none;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
    animation: fadeInUp 0.6s ease forwards;
  }

  .admin-panel.show {
    display: block;
  }

  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .admin-header h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
  }

  .admin-header .btn-logout {
    padding: 10px 24px;
    border-radius: 10px;
    background: rgba(239, 68, 68, 0.1);
    color: var(--danger);
    border: 1px solid rgba(239, 68, 68, 0.2);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .admin-header .btn-logout:hover {
    background: rgba(239, 68, 68, 0.2);
  }

  .admin-search {
    width: 100%;
    max-width: 300px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }

  .admin-search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .admin-search::placeholder {
    color: var(--text-muted);
    opacity: 0.6;
  }

  .counters {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .counter {
    background: var(--bg-card);
    padding: 20px 24px;
    border-radius: 14px;
    border: 1px solid var(--border);
    text-align: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  .counter h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.2;
  }

  .counter p {
    color: var(--text-muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .user-card {
    background: var(--bg-card);
    padding: 16px 20px;
    margin: 8px 0;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid var(--border);
    transition: all 0.2s;
  }

  .user-card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(124, 58, 237, 0.05);
  }

  .user-card .email {
    font-weight: 600;
    color: var(--text);
  }

  .user-card .status {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
  }

  .status-pendente {
    background: rgba(245, 158, 11, 0.15);
    color: var(--warning);
  }

  .status-aprovado {
    background: rgba(16, 185, 129, 0.15);
    color: var(--success);
  }

  .user-actions {
    display: flex;
    gap: 8px;
  }

  .btn-approve {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    background: rgba(16, 185, 129, 0.15);
    color: var(--success);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-approve:hover {
    background: rgba(16, 185, 129, 0.25);
  }

  .btn-delete {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    background: rgba(239, 68, 68, 0.1);
    color: var(--danger);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-delete:hover {
    background: rgba(239, 68, 68, 0.2);
  }

  .no-data {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .card {
      padding: 32px 24px;
    }

    .counters {
      grid-template-columns: 1fr;
    }

    .admin-header {
      flex-direction: column;
      align-items: stretch;
      gap: 16px;
    }

    .admin-search {
      max-width: 100%;
    }

    .user-card {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }

    .user-actions {
      justify-content: flex-start;
    }
  }

  @media (max-width: 480px) {
    .card {
      padding: 24px 16px;
    }

    .card h1 {
      font-size: 24px;
    }
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }

  ::-webkit-scrollbar-track {
    background: var(--bg);
  }

  ::-webkit-scrollbar-thumb {
    background: var(--accent);
    border-radius: 3px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(--accent-hover);
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginScreen">
  <div class="card">
    <svg class="logo" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <circle cx="40" cy="40" r="12" fill="#7C3AED" opacity="0.3"/>
      <circle cx="40" cy="40" r="8" fill="#7C3AED" filter="url(#glow)"/>
      <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.6"/>
      <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.4" transform="rotate(60,40,40)"/>
      <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.3" transform="rotate(120,40,40)"/>
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
    </svg>
    <h1>Átomo</h1>
    <p>Feito de estrelas.</p>
    <input id="email" placeholder="Email" type="email">
    <input id="password" type="password" placeholder="Senha">
    <button class="btn btn-primary" id="loginBtn">Entrar</button>
    <button class="btn btn-secondary" id="registerBtn">Criar conta</button>
    <button class="btn btn-admin" id="adminBtn">⚙ Acesso Admin</button>
    <div class="card-footer">Átomo — Feito de estrelas ✦</div>
  </div>
</div>

<div id="toast"></div>

<script>
const LOGO_B64 = "data:image/png;base64,";

const firebaseConfig = {
  apiKey: "AIzaSyDs1wyLdmz4_2DSt8FXSw-apIeEi0kwzZ4",
  authDomain: "horus-bf93b.firebaseapp.com",
  projectId: "horus-bf93b",
  storageBucket: "horus-bf93b.firebasestorage.app",
  messagingSenderId: "587109575045",
  appId: "1:587109575045:web:0fc32f109aa24399e07cec"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.innerText = msg;
  toast.className = 'show';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => { toast.className = ''; }, 3000);
}

// --- LOGIN ---
document.getElementById("loginBtn").onclick = function() {
  const btn = document.getElementById('loginBtn');
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  btn.textContent = 'Entrando...';
  btn.disabled = true;
  auth.signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
      localStorage.setItem('horus_user_email', userCredential.user.email);
      window.location.href = 'home.html';
    })
    .catch(err => {
      btn.textContent = 'Entrar';
      btn.disabled = false;
      showToast("❌ Erro no login: " + err.message);
    });
};

// --- REGISTER ---
document.getElementById("registerBtn").onclick = function() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  if (!email || !password) {
    showToast("❌ Preencha email e senha.");
    return;
  }
  db.collection("pedidos").add({ email, password, status: "pendente" })
    .then(() => showToast("✅ Pedido enviado! Aguarde aprovação."))
    .catch(err => showToast("❌ Erro: " + err.message));
};

// --- ADMIN LOGIN ---
document.getElementById("adminBtn").onclick = function() {
  document.getElementById("loginScreen").innerHTML = `
    <div class="card">
      <svg class="logo" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <circle cx="40" cy="40" r="12" fill="#7C3AED" opacity="0.3"/>
        <circle cx="40" cy="40" r="8" fill="#7C3AED" filter="url(#glow)"/>
        <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.6"/>
        <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.4" transform="rotate(60,40,40)"/>
        <ellipse cx="40" cy="40" rx="34" ry="12" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.3" transform="rotate(120,40,40)"/>
        <defs>
          <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
      </svg>
      <h1>Átomo</h1>
      <p>PAINEL ADMINISTRATIVO</p>
      <input id="adminEmail" placeholder="Email Admin" type="email">
      <input id="adminPassword" type="password" placeholder="Senha Admin">
      <button class="btn btn-primary" id="adminLoginBtn">Entrar</button>
      <button class="btn btn-secondary" onclick="location.reload()">↩ Voltar</button>
    </div>
  `;
  document.getElementById("adminLoginBtn").onclick = function() {
    const email = document.getElementById('adminEmail').value;
    const password = document.getElementById('adminPassword').value;
    if (email === "admin@horus.com" && password === "Admin123!") {
      abrirPainel();
    } else {
      showToast("❌ Credenciais incorretas!");
    }
  };
};

function abrirPainel() {
  document.body.innerHTML = `
    <div class="admin-panel show">
      <div class="admin-header">
        <h2>👥 Gerenciamento de Usuários</h2>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
          <input type="text" id="search" class="admin-search" placeholder="🔍 Buscar usuário...">
          <button class="btn-logout" onclick="window.location.href='index.html'">⏻ Sair</button>
        </div>
      </div>

      <div class="counters">
        <div class="counter" id="totalUsers"><h3>0</h3><p>Total</p></div>
        <div class="counter" id="approvedUsers"><h3>0</h3><p>Aprovados</p></div>
        <div class="counter" id="pendingUsers"><h3>0</h3><p>Pendentes</p></div>
      </div>

      <div id="usersList"></div>
    </div>
    <div id="toast"></div>
  `;

  document.getElementById('search').addEventListener('input', loadUsers);
  db.collection("pedidos").onSnapshot(() => { loadUsers(); });
  loadUsers();
}

function loadUsers() {
  const searchTerm = document.getElementById('search')?.value.toLowerCase() || '';
  const usersList = document.getElementById('usersList');
  if (!usersList) return;

  usersList.innerHTML = '';
  let total = 0, aprovados = 0, pendentes = 0;

  db.collection("pedidos").get().then(snapshot => {
    snapshot.forEach(doc => {
      const data = doc.data();
      if (!data.email.toLowerCase().includes(searchTerm)) return;
      total++;
      data.status === "aprovado" ? aprovados++ : pendentes++;

      const div = document.createElement('div');
      div.className = "user-card";
      div.innerHTML = `
        <div>
          <div class="email">${data.email}</div>
          <span class="status ${data.status === 'aprovado' ? 'status-aprovado' : 'status-pendente'}">
            ● ${data.status.charAt(0).toUpperCase() + data.status.slice(1)}
          </span>
        </div>
        <div class="user-actions">
          ${data.status === "pendente" ? `<button class="btn-approve" onclick="aprovar('${doc.id}','${data.email}','${data.password}')">✓ Aprovar</button>` : ""}
          <button class="btn-delete" onclick="excluir('${doc.id}')">✕ Excluir</button>
        </div>
      `;
      usersList.appendChild(div);
    });

    document.getElementById('totalUsers').querySelector('h3').innerText = total;
    document.getElementById('approvedUsers').querySelector('h3').innerText = aprovados;
    document.getElementById('pendingUsers').querySelector('h3').innerText = pendentes;
  });
}

function aprovar(id, email, password) {
  auth.createUserWithEmailAndPassword(email, password)
    .then(() => db.collection("pedidos").doc(id).update({ status: "aprovado" }))
    .then(() => showToast("✅ " + email + " aprovado!"))
    .catch(err => showToast("❌ Erro: " + err.message));
}

function excluir(id) {
  if (confirm("Deseja realmente excluir este usuário?")) {
    db.collection("pedidos").doc(id).delete()
      .then(() => showToast("🗑 Usuário excluído!"));
  }
}
</script>

</body>
</html>
